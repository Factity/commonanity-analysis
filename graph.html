<script>
(function(){
"use strict";

var DATA = JSON.parse(document.getElementById("graph-data").textContent);

var RAW_NODES = DATA.nodes;
var RAW_LINKS = DATA.links;
var NODE_LEGEND = DATA.nodeLegend;
var REL_LEGEND = DATA.relLegend;

document.title = DATA.name + " \u2014 Graph Explorer";
document.getElementById("doc-title").textContent = DATA.name;
document.getElementById("doc-stats").textContent =
  RAW_NODES.length + " nodes \u2022 " + RAW_LINKS.length + " relationships";

/* ---------------- helpers ---------------- */
function truncate(str, n){
  if(!str) return "";
  str = String(str);
  return str.length > n ? str.slice(0, n - 1).trim() + "\u2026" : str;
}
function radiusFor(d){
  var r = 5 + (d.size || 2) * 3.3;
  return Math.max(6, Math.min(22, r));
}
function fmtKey(k){ return k; }

var TYPE_PALETTE = [
  "#3fd8c4","#e8a33d","#e26565","#6ea8fe","#c792ea",
  "#7ee787","#f2cc60","#ff9ecb","#7dd3fc","#f97316",
  "#a3e635","#fb7185","#38bdf8","#facc15","#c084fc","#34d399"
];
var typeColorScale = {};
REL_LEGEND.forEach(function(rl, i){
  typeColorScale[rl.type] = TYPE_PALETTE[i % TYPE_PALETTE.length];
});

/* ---------------- state ---------------- */
var hiddenLabels = new Set();
var hiddenTypes = new Set();
var colorizeRel = true;
var alwaysShowLabels = false;
var selectedId = null;

var nodesById = {};
RAW_NODES.forEach(function(n){
  n.r = radiusFor(n);
  nodesById[n.id] = n;
});

/* adjacency for quick neighbor lookups */
var adjacency = {}; // id -> [{link, other}]
RAW_NODES.forEach(function(n){ adjacency[n.id] = []; });
RAW_LINKS.forEach(function(l){
  if(adjacency[l.source]) adjacency[l.source].push({link:l, otherId:l.target});
  if(adjacency[l.target]) adjacency[l.target].push({link:l, otherId:l.source});
});

/* ---------------- DOM refs ---------------- */
var svg = d3.select("#graph-svg");
var svgNode = svg.node();
var gZoom = svg.append("g").attr("class", "zoom-layer");
var gLinks = gZoom.append("g").attr("class", "links-layer");
var gNodes = gZoom.append("g").attr("class", "nodes-layer");
var gLabels = gZoom.append("g").attr("class", "labels-layer");

var hoverTip = document.getElementById("hover-tip");
var canvasWrap = document.getElementById("canvas-wrap");

function width(){ return canvasWrap.clientWidth; }
function height(){ return canvasWrap.clientHeight; }

/* ---------------- zoom ---------------- */
var currentTransform = d3.zoomIdentity;
var zoom = d3.zoom()
  .scaleExtent([0.05, 8])
  .on("start", function(){ svg.classed("dragging", true); })
  .on("zoom", function(event){
    currentTransform = event.transform;
    gZoom.attr("transform", currentTransform);
    updateLabelVisibility();
  })
  .on("end", function(){ svg.classed("dragging", false); });
svg.call(zoom);

/* ---------------- simulation ---------------- */
var simulation = d3.forceSimulation(RAW_NODES)
  .force("link", d3.forceLink(RAW_LINKS).id(function(d){ return d.id; })
      .distance(70).strength(0.22))
  .force("charge", d3.forceManyBody().strength(-165).theta(0.85))
  .force("center", d3.forceCenter(width()/2, height()/2))
  .force("collide", d3.forceCollide().radius(function(d){ return d.r + 8; }).iterations(1))
  .alphaDecay(0.028);

/* ---------------- render: links ---------------- */
var link = gLinks.selectAll("line.link")
  .data(RAW_LINKS)
  .join("line")
  .attr("class", "link")
  .attr("stroke", function(d){ return colorizeRel ? typeColorScale[d.type] : "#959aa1"; })
  .attr("stroke-opacity", 0.45)
  .attr("stroke-width", 1.1)
  .attr("marker-end", "url(#arrow)");

/* wider invisible hit-area for hover/tooltip */
var linkHit = gLinks.selectAll("line.link-hit")
  .data(RAW_LINKS)
  .join("line")
  .attr("class", "link-hit")
  .attr("stroke", "transparent")
  .attr("stroke-width", 10)
  .on("mouseenter", function(event, d){
    showTip(event, "RELATIONSHIP \u2022 " + d.type,
      (nodesById[d.source.id||d.source] ? truncate(nodesById[d.source.id||d.source].caption,40) : "") +
      "  \u2192  " +
      (nodesById[d.target.id||d.target] ? truncate(nodesById[d.target.id||d.target].caption,40) : "") +
      (d.props.similarity ? ("\nsimilarity: " + Number(d.props.similarity).toFixed(3)) : "") +
      (d.props.notes ? ("\n" + d.props.notes) : "")
    );
  })
  .on("mousemove", moveTip)
  .on("mouseleave", hideTip);

/* ---------------- render: nodes ---------------- */
var drag = d3.drag()
  .on("start", function(event, d){
    if(!event.active) simulation.alphaTarget(0.25).restart();
    d.fx = d.x; d.fy = d.y;
  })
  .on("drag", function(event, d){
    d.fx = event.x; d.fy = event.y;
  })
  .on("end", function(event, d){
    if(!event.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
  });

var node = gNodes.selectAll("circle.node-circle")
  .data(RAW_NODES)
  .join("circle")
  .attr("class", "node-circle hoverable")
  .attr("r", function(d){ return d.r; })
  .attr("fill", function(d){ return d.color; })
  .attr("id", function(d){ return "n_" + cssSafe(d.id); })
  .call(drag)
  .on("click", function(event, d){
    event.stopPropagation();
    selectNode(d.id);
  })
  .on("mouseenter", function(event, d){
    if(!selectedId) softHighlight(d.id);
    showTip(event, (d.label || "").toUpperCase(), d.caption);
  })
  .on("mousemove", moveTip)
  .on("mouseleave", function(event, d){
    if(!selectedId) clearHighlight();
    hideTip();
  });

var label = gLabels.selectAll("text.node-label")
  .data(RAW_NODES)
  .join("text")
  .attr("class", "node-label")
  .attr("text-anchor", "middle")
  .attr("font-size", 10.5)
  .text(function(d){ return truncate(d.caption, 34); });

svg.on("click", function(){ deselect(); });

/* ---------------- tick ---------------- */
simulation.on("tick", function(){
  link
    .attr("x1", function(d){ return d.source.x; })
    .attr("y1", function(d){ return d.source.y; })
    .attr("x2", function(d){ return d.target.x; })
    .attr("y2", function(d){ return d.target.y; });
  linkHit
    .attr("x1", function(d){ return d.source.x; })
    .attr("y1", function(d){ return d.source.y; })
    .attr("x2", function(d){ return d.target.x; })
    .attr("y2", function(d){ return d.target.y; });
  node
    .attr("cx", function(d){ return d.x; })
    .attr("cy", function(d){ return d.y; });
  label
    .attr("x", function(d){ return d.x; })
    .attr("y", function(d){ return d.y + d.r + 11; });
});

/* ---------------- tooltip ---------------- */
function showTip(event, kicker, text){
  document.querySelector("#hover-tip .t-label").textContent = kicker;
  document.querySelector("#hover-tip .t-cap").textContent = text;
  hoverTip.style.display = "block";
  moveTip(event);
}
function moveTip(event){
  var wrapRect = canvasWrap.getBoundingClientRect();
  var x = event.clientX - wrapRect.left + 16;
  var y = event.clientY - wrapRect.top + 16;
  var tipW = 290, tipH = 90;
  if(x + tipW > wrapRect.width) x = event.clientX - wrapRect.left - tipW - 16;
  if(y + tipH > wrapRect.height) y = event.clientY - wrapRect.top - tipH - 10;
  hoverTip.style.left = x + "px";
  hoverTip.style.top = y + "px";
}
function hideTip(){ hoverTip.style.display = "none"; }

/* ---------------- highlight ---------------- */
function softHighlight(id){
  var connected = new Set([id]);
  adjacency[id].forEach(function(a){ connected.add(a.otherId); });
  node.classed("dim", function(d){ return !connected.has(d.id); });
  label.classed("dim", function(d){ return !connected.has(d.id); });
  link.classed("dim", function(d){
    var s = d.source.id || d.source, t = d.target.id || d.target;
    return !(s === id || t === id);
  });
}
function clearHighlight(){
  node.classed("dim", false);
  label.classed("dim", false);
  link.classed("dim", false);
}

function cssSafe(id){ return id.replace(/[^a-zA-Z0-9_-]/g, "_"); }

/* ---------------- selection & detail panel ---------------- */
var detailEl = document.getElementById("detail");

function selectNode(id){
  selectedId = id;
  softHighlight(id);
  node.classed("selected", function(d){ return d.id === id; });
  renderDetail(id);
  detailEl.classList.add("open");
}
function deselect(){
  selectedId = null;
  clearHighlight();
  node.classed("selected", false);
  detailEl.classList.remove("open");
}
document.getElementById("detail-close").addEventListener("click", function(e){
  e.stopPropagation();
  deselect();
});

function renderDetail(id){
  var d = nodesById[id];
  if(!d) return;
  document.getElementById("detail-swatch").style.background = d.color;
  document.getElementById("detail-label").textContent = d.label;
  document.getElementById("detail-caption").textContent = d.caption;

  var body = document.getElementById("detail-body");
  body.innerHTML = "";

  Object.keys(d.props).forEach(function(k){
    var row = document.createElement("div");
    row.className = "prop-row";
    var kEl = document.createElement("div");
    kEl.className = "prop-key";
    kEl.textContent = fmtKey(k);
    var vEl = document.createElement("div");
    vEl.className = "prop-val";
    vEl.textContent = d.props[k];
    row.appendChild(kEl);
    row.appendChild(vEl);
    body.appendChild(row);
  });

  var conns = adjacency[id].slice().sort(function(a,b){
    return a.link.type.localeCompare(b.link.type);
  });

  if(conns.length){
    var connHead = document.createElement("div");
    connHead.className = "conn-head";
    connHead.textContent = "Connections \u2022 " + conns.length;
    body.appendChild(connHead);

    var byType = {};
    conns.forEach(function(c){
      var t = c.link.type;
      (byType[t] = byType[t] || []).push(c);
    });
    Object.keys(byType).sort().forEach(function(t){
      var grp = document.createElement("div");
      grp.className = "conn-group";
      var tEl = document.createElement("div");
      tEl.className = "conn-type";
      tEl.textContent = t + " (" + byType[t].length + ")";
      grp.appendChild(tEl);
      byType[t].forEach(function(c){
        var other = nodesById[c.otherId];
        if(!other) return;
        var item = document.createElement("div");
        item.className = "conn-item";
        var sw = document.createElement("div");
        sw.className = "swatch";
        sw.style.background = other.color;
        var cap = document.createElement("div");
        cap.className = "cap";
        cap.textContent = truncate(other.caption, 46);
        cap.title = other.caption;
        var arrow = document.createElement("div");
        arrow.className = "arrow";
        arrow.textContent = "\u2192";
        item.appendChild(sw);
        item.appendChild(cap);
        item.appendChild(arrow);
        item.addEventListener("click", function(e){
          e.stopPropagation();
          focusNode(other.id);
        });
        grp.appendChild(item);
      });
      body.appendChild(grp);
    });
  }
}

function focusNode(id){
  var d = nodesById[id];
  if(!d) return;
  selectNode(id);
  var scale = Math.max(currentTransform.k, 1.1);
  var tx = width()/2 - d.x*scale;
  var ty = height()/2 - d.y*scale;
  svg.transition().duration(500)
    .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

/* ---------------- label semantic zoom ---------------- */
function updateLabelVisibility(){
  if(alwaysShowLabels){
    label.style("display", null);
    return;
  }
  var show = currentTransform.k > 0.85;
  label.style("display", function(d){
    if(selectedId && (d.id === selectedId)) return null;
    return show ? null : "none";
  });
}

/* ---------------- visibility filters (legend toggles) ---------------- */
function applyFilters(){
  node.style("display", function(d){ return hiddenLabels.has(d.label) ? "none" : null; });
  label.style("display", function(d){
    if(hiddenLabels.has(d.label)) return "none";
    if(alwaysShowLabels) return null;
    if(selectedId && d.id === selectedId) return null;
    return currentTransform.k > 0.85 ? null : "none";
  });
  var isLinkVisible = function(d){
    var s = d.source.id || d.source, t = d.target.id || d.target;
    var sn = nodesById[s], tn = nodesById[t];
    if(hiddenTypes.has(d.type)) return false;
    if(sn && hiddenLabels.has(sn.label)) return false;
    if(tn && hiddenLabels.has(tn.label)) return false;
    return true;
  };
  link.style("display", function(d){ return isLinkVisible(d) ? null : "none"; });
  linkHit.style("display", function(d){ return isLinkVisible(d) ? null : "none"; });
}

/* ---------------- legends ---------------- */
function buildLegend(containerId, items, keyProp, hiddenSet, isRel){
  var container = document.getElementById(containerId);
  container.innerHTML = "";
  items.forEach(function(item){
    var row = document.createElement("div");
    row.className = "legend-row";
    var sw = document.createElement("div");
    sw.className = "swatch" + (isRel ? " rel" : "");
    sw.style.background = isRel ? (colorizeRel ? typeColorScale[item.type] : "#959aa1") : item.color;
    var name = document.createElement("div");
    name.className = "name";
    name.textContent = isRel ? item.type : item.label;
    var cnt = document.createElement("div");
    cnt.className = "cnt";
    cnt.textContent = item.count;
    row.appendChild(sw);
    row.appendChild(name);
    row.appendChild(cnt);
    row.dataset.key = isRel ? item.type : item.label;
    row.addEventListener("click", function(){
      var k = row.dataset.key;
      if(hiddenSet.has(k)){ hiddenSet.delete(k); row.classList.remove("off"); }
      else { hiddenSet.add(k); row.classList.add("off"); }
      applyFilters();
    });
    container.appendChild(row);
  });
  container._items = items;
  container._sw = function(){
    Array.prototype.forEach.call(container.children, function(row, i){
      var swatch = row.querySelector(".swatch");
      if(isRel) swatch.style.background = colorizeRel ? typeColorScale[items[i].type] : "#959aa1";
    });
  };
}
buildLegend("node-legend", NODE_LEGEND, "label", hiddenLabels, false);
buildLegend("rel-legend", REL_LEGEND, "type", hiddenTypes, true);

document.getElementById("legend-all-nodes").addEventListener("click", function(){
  hiddenLabels.clear();
  document.querySelectorAll("#node-legend .legend-row").forEach(function(r){ r.classList.remove("off"); });
  applyFilters();
});
document.getElementById("legend-none-nodes").addEventListener("click", function(){
  NODE_LEGEND.forEach(function(l){ hiddenLabels.add(l.label); });
  document.querySelectorAll("#node-legend .legend-row").forEach(function(r){ r.classList.add("off"); });
  applyFilters();
});

/* ---------------- toolbar toggles ---------------- */
var colorizeSwitch = document.getElementById("colorize-switch");
colorizeSwitch.addEventListener("click", function(){
  colorizeRel = !colorizeRel;
  colorizeSwitch.classList.toggle("on", colorizeRel);
  link.attr("stroke", function(d){ return colorizeRel ? typeColorScale[d.type] : "#959aa1"; });
  var relContainer = document.getElementById("rel-legend");
  if(relContainer._sw) relContainer._sw();
});

var labelsBtn = document.getElementById("btn-labels");
labelsBtn.addEventListener("click", function(){
  alwaysShowLabels = !alwaysShowLabels;
  labelsBtn.classList.toggle("active", alwaysShowLabels);
  applyFilters();
  updateLabelVisibility();
});

document.getElementById("btn-sidebar").addEventListener("click", function(){
  document.getElementById("sidebar").classList.toggle("collapsed");
});

/* ---------------- search ---------------- */
var searchInput = document.getElementById("search");
var searchResults = document.getElementById("search-results");
searchInput.addEventListener("input", function(){
  var q = searchInput.value.trim().toLowerCase();
  if(!q){ searchResults.classList.remove("show"); searchResults.innerHTML=""; return; }
  var hits = RAW_NODES.filter(function(n){
    if(n.caption && n.caption.toLowerCase().indexOf(q) !== -1) return true;
    for(var k in n.props){ if(n.props[k].toLowerCase().indexOf(q) !== -1) return true; }
    return false;
  }).slice(0, 30);
  searchResults.innerHTML = "";
  if(!hits.length){
    var e = document.createElement("div");
    e.className = "search-empty";
    e.textContent = "No matches";
    searchResults.appendChild(e);
  } else {
    hits.forEach(function(h){
      var row = document.createElement("div");
      row.className = "search-hit";
      var sw = document.createElement("div");
      sw.className = "swatch";
      sw.style.background = h.color;
      var cap = document.createElement("div");
      cap.className = "cap";
      cap.textContent = truncate(h.caption, 60);
      var lbl = document.createElement("div");
      lbl.className = "lbl";
      lbl.textContent = h.label;
      row.appendChild(sw); row.appendChild(cap); row.appendChild(lbl);
      row.addEventListener("click", function(){
        focusNode(h.id);
        searchResults.classList.remove("show");
        searchInput.value = h.caption;
      });
      searchResults.appendChild(row);
    });
  }
  searchResults.classList.add("show");
});
document.addEventListener("click", function(e){
  if(!document.getElementById("search-wrap").contains(e.target)){
    searchResults.classList.remove("show");
  }
});

/* ---------------- zoom controls ---------------- */
document.getElementById("zoom-in").addEventListener("click", function(){
  svg.transition().duration(200).call(zoom.scaleBy, 1.4);
});
document.getElementById("zoom-out").addEventListener("click", function(){
  svg.transition().duration(200).call(zoom.scaleBy, 1/1.4);
});
document.getElementById("zoom-reset").addEventListener("click", fitToScreen);
document.getElementById("btn-fit").addEventListener("click", fitToScreen);

function fitToScreen(){
  var visible = RAW_NODES.filter(function(d){ return !hiddenLabels.has(d.label); });
  if(!visible.length) return;
  var xs = visible.map(function(d){return d.x;});
  var ys = visible.map(function(d){return d.y;});
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  var w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
  var scale = Math.min(2.2, 0.85 / Math.max(w / width(), h / height()));
  var tx = width()/2 - scale * (minX + maxX) / 2;
  var ty = height()/2 - scale * (minY + maxY) / 2;
  svg.transition().duration(500)
    .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

/* ---------------- reset layout ---------------- */
document.getElementById("btn-reset").addEventListener("click", function(){
  RAW_NODES.forEach(function(d){ d.x = width()/2 + (Math.random()-0.5)*40; d.y = height()/2 + (Math.random()-0.5)*40; d.fx=null; d.fy=null; });
  simulation.alpha(1).restart();
});

/* ---------------- download PNG ---------------- */
document.getElementById("btn-png").addEventListener("click", function(){
  var svgEl = svgNode;
  var clone = svgEl.cloneNode(true);
  clone.setAttribute("width", width());
  clone.setAttribute("height", height());
  var bgRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  bgRect.setAttribute("x", "0"); bgRect.setAttribute("y", "0");
  bgRect.setAttribute("width", "100%"); bgRect.setAttribute("height", "100%");
  bgRect.setAttribute("fill", "#0a0d13");
  clone.insertBefore(bgRect, clone.firstChild);
  var serializer = new XMLSerializer();
  var svgStr = serializer.serializeToString(clone);
  var svgBlob = new Blob([svgStr], {type: "image/svg+xml;charset=utf-8"});
  var url = URL.createObjectURL(svgBlob);
  var img = new Image();
  img.onload = function(){
    var canvas = document.createElement("canvas");
    var scaleFactor = 2;
    canvas.width = width() * scaleFactor;
    canvas.height = height() * scaleFactor;
    var ctx = canvas.getContext("2d");
    ctx.scale(scaleFactor, scaleFactor);
    ctx.drawImage(img, 0, 0, width(), height());
    URL.revokeObjectURL(url);
    canvas.toBlob(function(blob){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "graph-export.png";
      a.click();
    });
  };
  img.src = url;
});

/* ---------------- resize ---------------- */
window.addEventListener("resize", function(){
  simulation.force("center", d3.forceCenter(width()/2, height()/2));
});

/* ---------------- initial settle then fit ---------------- */
simulation.on("end", function(){
  fitToScreen();
});
setTimeout(fitToScreen, 1800);

/* ---------------- init ---------------- */
applyFilters();
updateLabelVisibility();
document.getElementById("loading").style.display = "none";

})();

</script>

</body>
