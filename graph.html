d563-cb09-427f-b255-f80858c4de80:96", "label": "Action 6", "caption": "(115): Cybersecurity protection related to systemic risks associated with malicious use or attacks should duly consider accidental model leakage, unauthorised releases, circumvention of safety measures, and defence against cyberattacks, unauthorised access or model theft.", "color": "#e70b4e", "size": 3.6864, "props": {"number": "10", "Comments": "CoC does not explicitly consider accidental model leakage, circumvention of safety measures, defence against cyberattacks, or unauthorised access or model theft.", "EU AI Act (GPAI focus)": "(115): Cybersecurity protection related to systemic risks associated with malicious use or attacks should duly consider accidental model leakage, unauthorised releases, circumvention of safety measures, and defence against cyberattacks, unauthorised access or model theft.", "Point of Comparison": "Malicious use or attacks", "Hiroshima Process Code of Conduct (Action 6)": "ensure that the cybersecurity of advanced AI systems is appropriate to the relevant circumstances and the risks involved. securing model weights"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:97", "label": "Action 7", "caption": "50(2): Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable format and detectable as artificially generated or manipulated. Providers shall ensure their technical solutions are effective, interoperable, robust and reliable as far as this is technically feasible, taking into account the specificities and limitations of various types of content, the costs of implementation and the generally acknowledged state of the art, as may be reflected in relevant technical standards. This obligation shall not apply to the extent the AI systems perform an assistive function for standard editing or do not substantially alter the input data provided by the deployer or the semantics thereof, or where authorised by law to detect, prevent, investigate or prosecute criminal offences. (133): ...Such techniques and methods can be implemented at the level of the AI system or at the level of the AI model, including general-purpose AI models generating content.", "color": "#5b5461", "size": 2.8223999999999996, "props": {"number": "1", "Comments": "High commonality is based on the assumption that 'appropriate and technically feasible' is similar to the 'generally acknowledged state of the art'. 'Reliable' is covered by both. Providers could in theory use mechanisms already developed, instead of developing their own, though perhaps it would be difficult to implement outside the model. AIA is more specific, particularly regarding machine readability, with further information in Recital 133. There are exceptions to certain AI systems in the AIA. No exceptions in CoC.", "EU AI Act (GPAI focus)": "50(2): Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable format and detectable as artificially generated or manipulated. Providers shall ensure their technical solutions are effective, interoperable, robust and reliable as far as this is technically feasible, taking into account the specificities and limitations of various types of content, the costs of implementation and the generally acknowledged state of the art, as may be reflected in relevant technical standards. This obligation shall not apply to the extent the AI systems perform an assistive function for standard editing or do not substantially alter the input data provided by the deployer or the semantics thereof, or where authorised by law to detect, prevent, investigate or prosecute criminal offences. (133): ...Such techniques and methods can be implemented at the level of the AI system or at the level of the AI model, including general-purpose AI models generating content.", "Point of Comparison": "Content authentication and provenance mechanisms", "Hiroshima Process Code of Conduct (Action 7)": "Develop and deploy reliable content authentication and provenance mechanisms, where technically feasible, such as watermarking or other techniques to enable users to identify AI-generated content. This includes, where appropriate and technically feasible, content authentication and provenance mechanisms for content created with an organization's advanced AI system."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:98", "label": "Action 7", "caption": "50(2): ...Providers shall ensure their technical solutions are effective, interoperable. (133): Such techniques and methods should be sufficiently reliable, interoperable, effective and robust as far as this is technically feasible, taking into account available techniques or a combination of such techniques, such as watermarks, metadata identifications, cryptographic methods for proving provenance and authenticity of content, logging methods, fingerprints or other techniques, as may be appropriate.", "color": "#5b5461", "size": 2.8223999999999996, "props": {"number": "2", "Comments": "Solutions, such as metadata identifications and logging methods, would reasonably include an identifier of the service or model in order to be effective and interoperable.", "EU AI Act (GPAI focus)": "50(2): ...Providers shall ensure their technical solutions are effective, interoperable. (133): Such techniques and methods should be sufficiently reliable, interoperable, effective and robust as far as this is technically feasible, taking into account available techniques or a combination of such techniques, such as watermarks, metadata identifications, cryptographic methods for proving provenance and authenticity of content, logging methods, fingerprints or other techniques, as may be appropriate.", "Point of Comparison": "Identifier of the service or model that created the content", "Hiroshima Process Code of Conduct (Action 7)": "The provenance data should include an identifier of the service or model that created the content, but need not include user information."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:99", "label": "Action 7", "caption": "50(2): [Providers]...shall ensure that the outputs of the AI system are marked in a machine-readable format and detectable as artificially generated or manipulated. (133): Such techniques and methods should be sufficiently reliable, interoperable, effective and robust as far as this is technically feasible, taking into account available techniques or a combination of such techniques, such as watermarks, metadata identifications, cryptographic methods for proving provenance and authenticity of content, logging methods, fingerprints or other techniques, as may be appropriate.", "color": "#5b5461", "size": 2.8223999999999996, "props": {"number": "3", "Comments": "The CoC foresees the development of detection tools for users, while providers could use existing tools under the AIA. The AIA requires machine readability, which the CoC does not. So, while these are not exactly the same, they are at least complimentary.", "EU AI Act (GPAI focus)": "50(2): [Providers]...shall ensure that the outputs of the AI system are marked in a machine-readable format and detectable as artificially generated or manipulated. (133): Such techniques and methods should be sufficiently reliable, interoperable, effective and robust as far as this is technically feasible, taking into account available techniques or a combination of such techniques, such as watermarks, metadata identifications, cryptographic methods for proving provenance and authenticity of content, logging methods, fingerprints or other techniques, as may be appropriate.", "Point of Comparison": "Provide tools/APIs to check whether content was created by the organisation's AI", "Hiroshima Process Code of Conduct (Action 7)": "Organizations should also endeavor to develop tools or APIs to allow users to determine if particular content was created with their advanced AI system, such as via watermarks."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:100", "label": "Action 7", "caption": "50(2): ...Providers shall ensure their technical solutions are effective, interoperable, robust and reliable as far as this is technically feasible, taking into account the specificities and limitations of various types of content, the costs of implementation and the generally acknowledged state of the art. (133): When implementing this obligation, providers should also take into account the specificities and the limitations of the different types of content and the relevant technological and market developments in the field, as reflected in the generally acknowledged state of the art.", "color": "#5b5461", "size": 2.8223999999999996, "props": {"number": "4", "Comments": "AIA does not require providers to collaborate nor invest in research to advance the field, but rather that providers take into account the generally acknowledged state of the art, including relevant technological and market developments in the field.", "EU AI Act (GPAI focus)": "50(2): ...Providers shall ensure their technical solutions are effective, interoperable, robust and reliable as far as this is technically feasible, taking into account the specificities and limitations of various types of content, the costs of implementation and the generally acknowledged state of the art. (133): When implementing this obligation, providers should also take into account the specificities and the limitations of the different types of content and the relevant technological and market developments in the field, as reflected in the generally acknowledged state of the art.", "Point of Comparison": "Collaboration and investment in research", "Hiroshima Process Code of Conduct (Action 7)": "Organizations should collaborate and invest in research, as appropriate, to advance the state of the field."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:101", "label": "Action 7", "caption": "50(1): Providers shall ensure that AI systems intended to interact directly with natural persons are designed and developed in such a way that the natural persons concerned are informed that they are interacting with an AI system, unless this is obvious from the point of view of a natural person who is reasonably well-informed, observant and circumspect, taking into account the circumstances and the context of use.", "color": "#5b5461", "size": 2.8223999999999996, "props": {"number": "5", "Comments": "CoC: 'where possible and appropriate'. AIA: Applies to AI systems, not GPAI models specifically. Nothing about feasibility and appropriateness; instead: concrete exception (which might fall under the appropriateness condition in CoC).", "EU AI Act (GPAI focus)": "50(1): Providers shall ensure that AI systems intended to interact directly with natural persons are designed and developed in such a way that the natural persons concerned are informed that they are interacting with an AI system, unless this is obvious from the point of view of a natural person who is reasonably well-informed, observant and circumspect, taking into account the circumstances and the context of use.", "Point of Comparison": "Labelling / disclaimers for interactions with AI systems", "Hiroshima Process Code of Conduct (Action 7)": "Organizations are further encouraged to implement other mechanisms such as labeling or disclaimers to enable users, where possible and appropriate, to know when they are interacting with an AI system."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:102", "label": "Action 8", "caption": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. 56(2): The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: (d) the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof, which shall be proportionate to the risks, take into consideration their severity and probability and take into account the specific challenges of tackling those risks in light of the possible ways in which such risks may emerge and materialise along the AI value chain. (116): Codes of practice should also be focused on specific risk assessment and mitigation measures. (164): Compliance with the obligations should be enforceable, inter alia, through requests to take appropriate measures, including risk mitigation measures in the case of identified systemic risks. 112(6): By 2 August 2028 and every four years thereafter, the Commission shall submit a report on the review of the progress on the development of standardisation deliverables on the energy-efficient development of general-purpose AI models, and assess the need for further measures or actions, including binding measures or actions. The report shall be submitted to the European Parliament and to the Council, and it shall be made public. (174): Moreover, by 2 August 2028 and every four years thereafter, the Commission should evaluate and report to the European Parliament and to the Council on the progress on the development of standardisation deliverables on energy efficient development of general-purpose AI models, including the need for further measures or actions. Annex XI(Section 1): The technical documentation referred to in Article 53(1), point (a) shall contain at least the following information as appropriate to the size and risk profile of the model: 2. (e) known or estimated energy consumption of the model.", "color": "#ff99ad", "size": 2.8223999999999996, "props": {"number": "1", "Comments": "Risk Mitigation is required by both CoC and AIA. Development of mitigation tools is not required by AIA. Only risk mitigation in general is required; this could be done with tools provided by other organisations. The AIA is concerned about the energy impacts of models. There are no binding requirements on model providers now, however binding measures or actions might be set up in the future according to Art. 112(6).", "EU AI Act (GPAI focus)": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. 56(2): The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: (d) the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof, which shall be proportionate to the risks, take into consideration their severity and probability and take into account the specific challenges of tackling those risks in light of the possible ways in which such risks may emerge and materialise along the AI value chain. (116): Codes of practice should also be focused on specific risk assessment and mitigation measures. (164): Compliance with the obligations should be enforceable, inter alia, through requests to take appropriate measures, including risk mitigation measures in the case of identified systemic risks. 112(6): By 2 August 2028 and every four years thereafter, the Commission shall submit a report on the review of the progress on the development of standardisation deliverables on the energy-efficient development of general-purpose AI models, and assess the need for further measures or actions, including binding measures or actions. The report shall be submitted to the European Parliament and to the Council, and it shall be made public. (174): Moreover, by 2 August 2028 and every four years thereafter, the Commission should evaluate and report to the European Parliament and to the Council on the progress on the development of standardisation deliverables on energy efficient development of general-purpose AI models, including the need for further measures or actions. Annex XI(Section 1): The technical documentation referred to in Article 53(1), point (a) shall contain at least the following information as appropriate to the size and risk profile of the model: 2. (e) known or estimated energy consumption of the model.", "Point of Comparison": "Development of mitigation tool and proactive risk mitigation", "Hiroshima Process Code of Conduct (Action 8)": "Organizations also commit to invest in developing appropriate mitigation tools, and work to proactively manage the risks of advanced AI systems, including environmental and climate impacts, so that the benefits can be realized."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:103", "label": "Action 8", "caption": "1(1): ...ensuring a high level of protection of health, safety, fundamental rights enshrined in the Charter, including democracy, the rule of law and environmental protection, against the harmful effects of AI systems in the Union and supporting innovation. (176): the objective of this Regulation, namely to improve the functioning of the internal market and to promote the uptake of human centric and trustworthy AI, while ensuring a high level of protection of health, safety, fundamental rights enshrined in the Charter, including democracy, the rule of law and environmental protection against harmful effects of AI systems in the Union and supporting innovation. (115): That protection could be facilitated by securing model weights, algorithms, servers, and data sets, such as through operational security measures for information security, specific cybersecurity policies, adequate technical and established solutions, and cyber and physical access controls, appropriate to the relevant circumstances and the risks involved. 53(1)(b): draw up, keep up-to-date and make available information and documentation to providers of AI systems who intend to integrate the general-purpose AI model into their AI systems. Without prejudice to the need to observe and protect intellectual property rights and confidential business information or trade secrets in accordance with Union and national law, the information and documentation shall: (110): In particular, international approaches have so far identified the need to pay attention to risks from potential intentional misuse or unintended issues of control relating to alignment with human intent; chemical, biological, radiological, and nuclear risks, such as the ways in which barriers to entry can be lowered, including for weapons development, design acquisition, or use; offensive cyber capabilities, such as the ways in vulnerability discovery, exploitation, or operational use can be enabled; the effects of interaction and tool use, including for example the capacity to control physical systems and interfere with critical infrastructure; risks from models of making copies of themselves or self-replicating or training other models; the ways in which models can give rise to harmful bias and discrimination with risks to individuals, communities or societies; the facilitation of disinformation or harming privacy with threats to democratic values and human rights; risk that a particular event could lead to a chain reaction with considerable negative effects that could affect up to an entire city, an entire domain activity or an entire community. (48): The extent of the adverse impact caused by the AI system on the fundamental rights protected by the Charter is of particular relevance when classifying an AI system as high risk. Those rights include: protection of personal data, the right to non-discrimination, the right to education, the rights of persons with disabilities, gender equality, intellectual property rights. In addition to those rights, it is important to highlight the fact that children have specific rights as enshrined in Article 24 of the Charter and in the United Nations Convention on the Rights of the Child (even though this recital is about AI systems and not about GPAI models, it is relevant here because it lists fundamental rights. Risks to fundamental rights must be mitigated as part of systemic risk mitigation according to 3(65) and 55(1)(b)). (133): A variety of AI systems can generate large quantities of synthetic content that becomes increasingly hard for humans to distinguish from human-generated and authentic content. The wide availability and increasing capabilities of those systems have a significant impact on the integrity and trust in the information ecosystem, raising new risks of misinformation and manipulation at scale.", "color": "#ff99ad", "size": 2.8223999999999996, "props": {"number": "2", "Comments": "Commonality: The objectives of the research investments prescribed by the CoC are mostly in line with the objectives of the AIA. The only objective that is not explicitly mentioned in the AIA regarding GPAI models is the protection of vulnerable groups (apart from children). Instead, the AIA individually lists the rights of people with disabilities and gender equality. Discrepancy: The CoC requires research investments to promote those objectives. The AIA does not require research investments.", "EU AI Act (GPAI focus)": "1(1): ...ensuring a high level of protection of health, safety, fundamental rights enshrined in the Charter, including democracy, the rule of law and environmental protection, against the harmful effects of AI systems in the Union and supporting innovation. (176): the objective of this Regulation, namely to improve the functioning of the internal market and to promote the uptake of human centric and trustworthy AI, while ensuring a high level of protection of health, safety, fundamental rights enshrined in the Charter, including democracy, the rule of law and environmental protection against harmful effects of AI systems in the Union and supporting innovation. (115): That protection could be facilitated by securing model weights, algorithms, servers, and data sets, such as through operational security measures for information security, specific cybersecurity policies, adequate technical and established solutions, and cyber and physical access controls, appropriate to the relevant circumstances and the risks involved. 53(1)(b): draw up, keep up-to-date and make available information and documentation to providers of AI systems who intend to integrate the general-purpose AI model into their AI systems. Without prejudice to the need to observe and protect intellectual property rights and confidential business information or trade secrets in accordance with Union and national law, the information and documentation shall: (110): In particular, international approaches have so far identified the need to pay attention to risks from potential intentional misuse or unintended issues of control relating to alignment with human intent; chemical, biological, radiological, and nuclear risks, such as the ways in which barriers to entry can be lowered, including for weapons development, design acquisition, or use; offensive cyber capabilities, such as the ways in vulnerability discovery, exploitation, or operational use can be enabled; the effects of interaction and tool use, including for example the capacity to control physical systems and interfere with critical infrastructure; risks from models of making copies of themselves or self-replicating or training other models; the ways in which models can give rise to harmful bias and discrimination with risks to individuals, communities or societies; the facilitation of disinformation or harming privacy with threats to democratic values and human rights; risk that a particular event could lead to a chain reaction with considerable negative effects that could affect up to an entire city, an entire domain activity or an entire community. (48): The extent of the adverse impact caused by the AI system on the fundamental rights protected by the Charter is of particular relevance when classifying an AI system as high risk. Those rights include: protection of personal data, the right to non-discrimination, the right to education, the rights of persons with disabilities, gender equality, intellectual property rights. In addition to those rights, it is important to highlight the fact that children have specific rights as enshrined in Article 24 of the Charter and in the United Nations Convention on the Rights of the Child (even though this recital is about AI systems and not about GPAI models, it is relevant here because it lists fundamental rights. Risks to fundamental rights must be mitigated as part of systemic risk mitigation according to 3(65) and 55(1)(b)). (133): A variety of AI systems can generate large quantities of synthetic content that becomes increasingly hard for humans to distinguish from human-generated and authentic content. The wide availability and increasing capabilities of those systems have a significant impact on the integrity and trust in the information ecosystem, raising new risks of misinformation and manipulation at scale.", "Point of Comparison": "Investments in research to advance AI safety, security, and addressing key risks", "Hiroshima Process Code of Conduct (Action 8)": "Prioritize research to mitigate societal, safety and security risks and prioritize investment in effective mitigation measures. This includes conducting, collaborating on and investing in research that supports the advancement of AI safety, security, and trust, and addressing key risks. Organizations commit to conducting, collaborating on and investing in research that supports the advancement of AI safety, security, trustworthiness and addressing key risks, such as prioritizing research on upholding democratic values, respecting human rights, protecting children and vulnerable groups, safeguarding intellectual property rights and privacy, and avoiding harmful bias, mis- and disinformation, and information manipulation."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:104", "label": "Action 8", "caption": "38(3): The Commission shall provide for the exchange of knowledge and best practices between notifying authorities. 66: the Board may in particular: (b) collect and share technical and regulatory expertise and best practices among Member States. 68(3): The scientific panel shall advise and support the AI Office, in particular with regard to the following tasks: (a) (ii) contributing to the development of tools and methodologies for evaluating capabilities of general-purpose AI models and systems, including through benchmarks. 68(2): The scientific panel shall consist of experts selected by the Commission on the basis of up-to-date scientific or technical expertise in the field of AI necessary for the tasks set out in paragraph 3, and shall be able to demonstrate meeting all of the following conditions: (b) independence from any provider of AI systems or general-purpose AI models. 65(2): The Board shall be composed of one representative per Member State. (149): such representatives may be any persons belonging to public entities who should have the relevant competences and powers to facilitate coordination at national level and contribute to the achievement of the Board's tasks. (148): Furthermore, a Board composed of representatives of the Member States, a scientific panel to integrate the scientific community and an advisory forum to contribute stakeholder input to the implementation of this Regulation, at Union and national level, should be established. (20): The European Artificial Intelligence Board (the Board) should support the Commission, to promote AI literacy tools, public awareness and understanding of the benefits, risks, safeguards, rights and obligations in relation to the use of AI systems. In cooperation with the relevant stakeholders, the Commission and the Member States should facilitate the drawing up of voluntary codes of conduct to advance AI literacy among persons dealing with the development, operation and use of AI. (150): With a view to ensuring the involvement of stakeholders in the implementation and application of this Regulation, an advisory forum should be established to advise and provide technical expertise to the Board and the Commission. To ensure a varied and balanced stakeholder representation between commercial and non-commercial interest and, within the category of commercial interests, with regard to SMEs and other undertakings, the advisory forum should comprise inter alia industry, start-ups, SMEs, academia, civil society, including the social partners, as well as the Fundamental Rights Agency, ENISA, the European Committee for Standardization (CEN), the European Committee for Electrotechnical Standardization (CENELEC) and the European Telecommunications Standards Institute (ETSI). 56(3): The AI Office may invite all providers of general-purpose AI models, as well as relevant national competent authorities, to participate in the drawing-up of codes of practice. Civil society organisations, industry, academia and other relevant stakeholders, such as downstream providers and independent experts, may support the process.", "color": "#ff99ad", "size": 2.8223999999999996, "props": {"number": "3", "Comments": "There are some obligations and mandates that the scientific panel (Recital (116)), the AI Board (66(b), Recital (20)), and the AIO/EC have related to the development and sharing of best practices. Providers are not directly part of those institutions (65(2)/Recital (149) and 68(2)), but they might give advice to the AI Board and EC through the advisory forum (Recital (150)). Providers can participate in the drawing-up of the Codes of Practice. Civil society organisations, industry, academia and other relevant stakeholders, such as downstream providers and independent experts, may support the drawing-up of the Codes of Practice. This is another opportunity for those stakeholders to share research and best practices on risk mitigation (56(3)).", "EU AI Act (GPAI focus)": "38(3): The Commission shall provide for the exchange of knowledge and best practices between notifying authorities. 66: the Board may in particular: (b) collect and share technical and regulatory expertise and best practices among Member States. 68(3): The scientific panel shall advise and support the AI Office, in particular with regard to the following tasks: (a) (ii) contributing to the development of tools and methodologies for evaluating capabilities of general-purpose AI models and systems, including through benchmarks. 68(2): The scientific panel shall consist of experts selected by the Commission on the basis of up-to-date scientific or technical expertise in the field of AI necessary for the tasks set out in paragraph 3, and shall be able to demonstrate meeting all of the following conditions: (b) independence from any provider of AI systems or general-purpose AI models. 65(2): The Board shall be composed of one representative per Member State. (149): such representatives may be any persons belonging to public entities who should have the relevant competences and powers to facilitate coordination at national level and contribute to the achievement of the Board's tasks. (148): Furthermore, a Board composed of representatives of the Member States, a scientific panel to integrate the scientific community and an advisory forum to contribute stakeholder input to the implementation of this Regulation, at Union and national level, should be established. (20): The European Artificial Intelligence Board (the Board) should support the Commission, to promote AI literacy tools, public awareness and understanding of the benefits, risks, safeguards, rights and obligations in relation to the use of AI systems. In cooperation with the relevant stakeholders, the Commission and the Member States should facilitate the drawing up of voluntary codes of conduct to advance AI literacy among persons dealing with the development, operation and use of AI. (150): With a view to ensuring the involvement of stakeholders in the implementation and application of this Regulation, an advisory forum should be established to advise and provide technical expertise to the Board and the Commission. To ensure a varied and balanced stakeholder representation between commercial and non-commercial interest and, within the category of commercial interests, with regard to SMEs and other undertakings, the advisory forum should comprise inter alia industry, start-ups, SMEs, academia, civil society, including the social partners, as well as the Fundamental Rights Agency, ENISA, the European Committee for Standardization (CEN), the European Committee for Electrotechnical Standardization (CENELEC) and the European Telecommunications Standards Institute (ETSI). 56(3): The AI Office may invite all providers of general-purpose AI models, as well as relevant national competent authorities, to participate in the drawing-up of codes of practice. Civil society organisations, industry, academia and other relevant stakeholders, such as downstream providers and independent experts, may support the process.", "Point of Comparison": "Share research and best practices on risk mitigation", "Hiroshima Process Code of Conduct (Action 8)": "Organizations are encouraged to share research and best practices on risk mitigation."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:105", "label": "Action 9", "caption": "1(1): The purpose of this Regulation is to improve the functioning of the internal market and promote the uptake of human-centric and trustworthy artificial intelligence (AI). 57(5): AI regulatory sandboxes established under paragraph 1 shall provide for a controlled environment that fosters innovation and facilitates the development, training, testing and validation of innovative AI systems.", "color": "#F79767", "size": 2.8223999999999996, "props": {"number": "1", "Comments": "Each has a different focus i.e., CoC addressing the world's greatest challenges vs AIA developing innovative and trustworthy AI.", "EU AI Act (GPAI focus)": "1(1): The purpose of this Regulation is to improve the functioning of the internal market and promote the uptake of human-centric and trustworthy artificial intelligence (AI). 57(5): AI regulatory sandboxes established under paragraph 1 shall provide for a controlled environment that fosters innovation and facilitates the development, training, testing and validation of innovative AI systems.", "Point of Comparison": "Purpose and priority", "Hiroshima Process Code of Conduct (Action 9)": "Prioritize the development of advanced AI systems to address the world's greatest challenges, notably but not limited to the climate crisis, global health and education."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:106", "label": "Action 9", "caption": "1(1): ...ensuring a high level of protection of health, safety, fundamental rights enshrined in the Charter, including democracy, the rule of law and environmental protection, against the harmful effects of AI systems in the Union and supporting innovation.", "color": "#F79767", "size": 2.8223999999999996, "props": {"number": "2", "Comments": "Global vs EU scope. According to the CoC, the world's greatest challenges must be actively addressed. There is no such obligation in the AIA. The AIA is focused on ensuring that no harm is done (to health, safety, and fundamental rights).", "EU AI Act (GPAI focus)": "1(1): ...ensuring a high level of protection of health, safety, fundamental rights enshrined in the Charter, including democracy, the rule of law and environmental protection, against the harmful effects of AI systems in the Union and supporting innovation.", "Point of Comparison": "Scope", "Hiroshima Process Code of Conduct (Action 9)": "These efforts are undertaken in support of progress on the United Nations Sustainable Development Goals, and to encourage AI development for global benefit."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:107", "label": "Action 9", "caption": "1(1): promote the uptake of human-centric and trustworthy artificial intelligence (AI). (8): this Regulation supports the objective of promoting the European human-centric approach to AI.", "color": "#F79767", "size": 2.8223999999999996, "props": {"number": "3", "Comments": "Similar", "EU AI Act (GPAI focus)": "1(1): promote the uptake of human-centric and trustworthy artificial intelligence (AI). (8): this Regulation supports the objective of promoting the European human-centric approach to AI.", "Point of Comparison": "Trustworthy and human-centric AI", "Hiroshima Process Code of Conduct (Action 9)": "Organizations should prioritize responsible stewardship of trustworthy and human-centric AI."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:108", "label": "Action 9", "caption": "4: Providers and deployers of AI systems shall take measures to ensure, to their best extent, a sufficient level of AI literacy of their staff and other persons dealing with the operation and use of AI systems on their behalf, taking into account their technical knowledge, experience, education and training and the context the AI systems are to be used in, and considering the persons or groups of persons on whom the AI systems are to be used. 66(f) [Tasks of the Board]: support the Commission in promoting AI literacy, public awareness and understanding of the benefits, risks, safeguards and rights and obligations in relation to the use of AI systems. 95(2)(c) [Codes of conduct for voluntary application of specific requirements]: promoting AI literacy, in particular that of persons dealing with the development, operation and use of AI.", "color": "#F79767", "size": 2.8223999999999996, "props": {"number": "4", "Comments": "Organizations vs the AI Board (and EC) support public AI literacy. Providers must help ensure AI literacy of their staff and certain others. Codes of conduct for providers are voluntary and focused more specifically on the development, operation and use of AI.", "EU AI Act (GPAI focus)": "4: Providers and deployers of AI systems shall take measures to ensure, to their best extent, a sufficient level of AI literacy of their staff and other persons dealing with the operation and use of AI systems on their behalf, taking into account their technical knowledge, experience, education and training and the context the AI systems are to be used in, and considering the persons or groups of persons on whom the AI systems are to be used. 66(f) [Tasks of the Board]: support the Commission in promoting AI literacy, public awareness and understanding of the benefits, risks, safeguards and rights and obligations in relation to the use of AI systems. 95(2)(c) [Codes of conduct for voluntary application of specific requirements]: promoting AI literacy, in particular that of persons dealing with the development, operation and use of AI.", "Point of Comparison": "AI literacy", "Hiroshima Process Code of Conduct (Action 9)": "Organizations should support digital literacy initiatives that promote the education and training of the public, including students and workers, to enable them to benefit from the use of advanced AI systems, and to help individuals and communities better understand the nature, capabilities, limitations, and impact of these technologies."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:109", "label": "Action 9", "caption": "53(3): Providers of general-purpose AI models shall cooperate as necessary with the Commission and the national competent authorities in the exercise of their competences and powers pursuant to this Regulation. 67(1) [Advisory forum to AI Board and EC]: An advisory forum shall be established to provide technical expertise and advise the Board and the Commission, and to contribute to their tasks under this Regulation. 67(2) [Advisory forum to AI Board and EC]: The membership of the advisory forum shall represent a balanced selection of stakeholders, including industry, start-ups, SMEs, civil society... (165): Providers of all AI systems, high-risk or not, and AI models should also be encouraged to apply on a voluntary basis additional requirements related, for example, to inclusive and diverse design and development of AI systems, including attention to vulnerable persons and accessibility to persons with disability, stakeholders participation with the involvement, as appropriate, of relevant stakeholders such as business and civil society organisations, academia, research organisations, trade unions and consumer protection organisations in the design and development of AI systems.", "color": "#F79767", "size": 2.8223999999999996, "props": {"number": "5", "Comments": "Global vs EU focus. Act seems to have EU and national institutions facilitating.", "EU AI Act (GPAI focus)": "53(3): Providers of general-purpose AI models shall cooperate as necessary with the Commission and the national competent authorities in the exercise of their competences and powers pursuant to this Regulation. 67(1) [Advisory forum to AI Board and EC]: An advisory forum shall be established to provide technical expertise and advise the Board and the Commission, and to contribute to their tasks under this Regulation. 67(2) [Advisory forum to AI Board and EC]: The membership of the advisory forum shall represent a balanced selection of stakeholders, including industry, start-ups, SMEs, civil society... (165): Providers of all AI systems, high-risk or not, and AI models should also be encouraged to apply on a voluntary basis additional requirements related, for example, to inclusive and diverse design and development of AI systems, including attention to vulnerable persons and accessibility to persons with disability, stakeholders participation with the involvement, as appropriate, of relevant stakeholders such as business and civil society organisations, academia, research organisations, trade unions and consumer protection organisations in the design and development of AI systems.", "Point of Comparison": "Role of civil society in addressing challenges", "Hiroshima Process Code of Conduct (Action 9)": "Organizations should work with civil society and community groups to identify priority challenges and develop innovative solutions to address the world's greatest challenges."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:110", "label": "Action 10", "caption": "40(3): The participants in the standardisation process shall seek to promote investment and innovation in AI, including through increasing legal certainty, as well as the competitiveness and growth of the Union market, to contribute to strengthening global cooperation on standardisation and taking into account existing international standards in the field of AI that are consistent with Union values, fundamental rights and interests, and to enhance multi-stakeholder governance ensuring a balanced representation of interests and the effective participation of all relevant stakeholders. 56(3): The AI Office may invite all providers of general-purpose AI models to participate in the drawing-up of codes of practice. 62(1)(d): Member States shall facilitate the participation of SMEs and other relevant stakeholders in the standardisation development process.", "color": "#a9c152", "size": 2.8223999999999996, "props": {"number": "1", "Comments": "While the AIA does not strictly require providers to work to develop standards, it is in their interest to do so and they are, in theory, invited and facilitated to do so by authorities.", "EU AI Act (GPAI focus)": "40(3): The participants in the standardisation process shall seek to promote investment and innovation in AI, including through increasing legal certainty, as well as the competitiveness and growth of the Union market, to contribute to strengthening global cooperation on standardisation and taking into account existing international standards in the field of AI that are consistent with Union values, fundamental rights and interests, and to enhance multi-stakeholder governance ensuring a balanced representation of interests and the effective participation of all relevant stakeholders. 56(3): The AI Office may invite all providers of general-purpose AI models to participate in the drawing-up of codes of practice. 62(1)(d): Member States shall facilitate the participation of SMEs and other relevant stakeholders in the standardisation development process.", "Point of Comparison": "Standards and best practices", "Hiroshima Process Code of Conduct (Action 10)": "Organizations are encouraged to contribute to the development and, where appropriate, use of international technical standards and best practices... working with Standards Development Organizations (SDOs), also when developing organizations testing methodologies, cybersecurity policies, public reporting, and other measures."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:111", "label": "Action 10", "caption": "50(1): Providers shall ensure that AI systems intended to interact directly with natural persons are designed and developed in such a way that the natural persons concerned are informed that they are interacting with an AI system. 50(2): Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable format and detectable as artificially generated or manipulated. Providers shall ensure their technical solutions are effective, interoperable, robust and reliable as far as this is technically feasible, taking into account the specificities and limitations of various types of content, the costs of implementation and the generally acknowledged state of the art, as may be reflected in relevant technical standards.", "color": "#a9c152", "size": 2.8223999999999996, "props": {"number": "2", "Comments": "Broadly similar. While the AIA does not strictly require providers to work to develop standards, this is a reasonable way for them to meet the AIA's interoperability requirement.", "EU AI Act (GPAI focus)": "50(1): Providers shall ensure that AI systems intended to interact directly with natural persons are designed and developed in such a way that the natural persons concerned are informed that they are interacting with an AI system. 50(2): Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable format and detectable as artificially generated or manipulated. Providers shall ensure their technical solutions are effective, interoperable, robust and reliable as far as this is technically feasible, taking into account the specificities and limitations of various types of content, the costs of implementation and the generally acknowledged state of the art, as may be reflected in relevant technical standards.", "Point of Comparison": "Content authentication and provenance", "Hiroshima Process Code of Conduct (Action 10)": "Organizations are encouraged to contribute to the development and, where appropriate, use of international technical standards and best practices, including for watermarking. In particular, organizations also are encouraged to work to develop interoperable international technical standards and frameworks to help users distinguish content generated by AI from non-AI generated content. content authentication and provenance mechanisms."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:112", "label": "Action 11", "caption": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. (110): the ways in which models can give rise to harmful bias and discrimination with risks to individuals, communities or societies. Annex XI(Section 1)(2)(c): information on the data used for training, testing and validation, where applicable, including the type and provenance of data and curation methodologies (e.g. cleaning, filtering, etc.), the number of data points, their scope and main characteristics; how the data was obtained and selected as well as all other measures to detect the unsuitability of data sources and methods to detect identifiable biases, where applicable.", "color": "#a8bd57", "size": 2.8223999999999996, "props": {"number": "1", "Comments": "CoC has a high-level ask to manage data quality, while the AIA implies this must be done (as such measures must be documented). CoC data input measures are similar to AIA curation methodologies. The CoC is more explicit about not divulging confidential or sensitive data. However, the AIA implies the need for measures to preserve both: divulging confidential data could harm privacy, and divulging sensitive data could be an info hazard leading to various harms.", "EU AI Act (GPAI focus)": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. (110): the ways in which models can give rise to harmful bias and discrimination with risks to individuals, communities or societies. Annex XI(Section 1)(2)(c): information on the data used for training, testing and validation, where applicable, including the type and provenance of data and curation methodologies (e.g. cleaning, filtering, etc.), the number of data points, their scope and main characteristics; how the data was obtained and selected as well as all other measures to detect the unsuitability of data sources and methods to detect identifiable biases, where applicable.", "Point of Comparison": "Existence of measures on data to mitigate against harmful biases", "Hiroshima Process Code of Conduct (Action 11)": "Organizations are encouraged to take appropriate measures to manage data quality, including training data and data collection, to mitigate against harmful biases. Implement appropriate data input measures. Appropriate measures could include transparency, privacy-preserving training techniques, and/or testing and fine-tuning to ensure that systems do not divulge confidential or sensitive data."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:113", "label": "Action 11", "caption": "2(7): Union law on the protection of personal data, privacy and the confidentiality of communications applies to personal data processed in connection with the rights and obligations laid down in this Regulation. This Regulation shall not affect Regulation (EU) 2016/679 or (EU) 2018/1725, or Directive 2002/58/EC or (EU) 2016/680, without prejudice to Article 10(5) and Article 59 of this Regulation. 3(65): systemic risk means a risk that is specific to the high-impact capabilities of general-purpose AI models, having a significant impact on the Union market due to their reach, or due to actual or reasonably foreseeable negative effects on public health, safety, public security, fundamental rights, or the society as a whole, that can be propagated at scale across the value chain. (28): Aside from the many beneficial uses of AI, it can also be misused and provide novel and powerful tools for manipulative, exploitative and social control practices. Such practices are particularly harmful and abusive and should be prohibited because they contradict Union values of respect for human dignity, freedom, equality, democracy and the rule of law and fundamental rights enshrined in the Charter, including the right to non-discrimination, to data protection and to privacy and the rights of the child. (110): the facilitation of disinformation or harming privacy with threats to democratic values and human rights. 55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. 53(1)(c): put in place a policy to comply with Union law on copyright and related rights, and in particular to identify and comply with, including through state-of-the-art technologies, a reservation of rights expressed pursuant to Article 4(3) of Directive (EU) 2019/790. Recitals (105), (106), (107), and (108).", "color": "#a8bd57", "size": 2.8223999999999996, "props": {"number": "2", "Comments": "Privacy and personal data: Union law on privacy and personal data applies to data processed in connection with the rights and obligations laid down in the AIA (Art. 2(7)). AIA is more explicit and comprehensive: Systemic risks to fundamental rights (Art. 3(65)), which include harms to privacy (Recital (28)), must be mitigated. Copyright, intellectual property and related rights. CoC: 'safeguards'. AIA: 'policy to comply with Union law'. AIA, combined with Union law, is much more detailed.", "EU AI Act (GPAI focus)": "2(7): Union law on the protection of personal data, privacy and the confidentiality of communications applies to personal data processed in connection with the rights and obligations laid down in this Regulation. This Regulation shall not affect Regulation (EU) 2016/679 or (EU) 2018/1725, or Directive 2002/58/EC or (EU) 2016/680, without prejudice to Article 10(5) and Article 59 of this Regulation. 3(65): systemic risk means a risk that is specific to the high-impact capabilities of general-purpose AI models, having a significant impact on the Union market due to their reach, or due to actual or reasonably foreseeable negative effects on public health, safety, public security, fundamental rights, or the society as a whole, that can be propagated at scale across the value chain. (28): Aside from the many beneficial uses of AI, it can also be misused and provide novel and powerful tools for manipulative, exploitative and social control practices. Such practices are particularly harmful and abusive and should be prohibited because they contradict Union values of respect for human dignity, freedom, equality, democracy and the rule of law and fundamental rights enshrined in the Charter, including the right to non-discrimination, to data protection and to privacy and the rights of the child. (110): the facilitation of disinformation or harming privacy with threats to democratic values and human rights. 55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. 53(1)(c): put in place a policy to comply with Union law on copyright and related rights, and in particular to identify and comply with, including through state-of-the-art technologies, a reservation of rights expressed pursuant to Article 4(3) of Directive (EU) 2019/790. Recitals (105), (106), (107), and (108).", "Point of Comparison": "Safeguards to respect privacy, personal data, copyright, and intellectual property", "Hiroshima Process Code of Conduct (Action 11)": "Organizations are encouraged to implement appropriate safeguards, to respect rights related to privacy and intellectual property, including copyright-protected content. Implement appropriate protections for personal data and intellectual property."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:114", "label": "Action 11", "caption": "2(7): Union law on the protection of personal data, privacy and the confidentiality of communications applies to personal data processed in connection with the rights and obligations laid down in this Regulation. This Regulation shall not affect Regulation (EU) 2016/679 or (EU) 2018/1725, or Directive 2002/58/EC or (EU) 2016/680, without prejudice to Article 10(5) and Article 59 of this Regulation. 53(1)(c): put in place a policy to comply with Union law on copyright and related rights, and in particular to identify and comply with, including through state-of-the-art technologies, a reservation of rights expressed pursuant to Article 4(3) of Directive (EU) 2019/790. Recitals 105, 106, 107, 108.", "color": "#a8bd57", "size": 2.8223999999999996, "props": {"number": "3", "Comments": "CoC is not specific about which legal frameworks should be complied with. AIA states: 'put in place a policy to comply with Union law on copyright and related rights' and explicitly mentions Directive (EU) 2019/790.", "EU AI Act (GPAI focus)": "2(7): Union law on the protection of personal data, privacy and the confidentiality of communications applies to personal data processed in connection with the rights and obligations laid down in this Regulation. This Regulation shall not affect Regulation (EU) 2016/679 or (EU) 2018/1725, or Directive 2002/58/EC or (EU) 2016/680, without prejudice to Article 10(5) and Article 59 of this Regulation. 53(1)(c): put in place a policy to comply with Union law on copyright and related rights, and in particular to identify and comply with, including through state-of-the-art technologies, a reservation of rights expressed pursuant to Article 4(3) of Directive (EU) 2019/790. Recitals 105, 106, 107, 108.", "Point of Comparison": "Comply with applicable legal frameworks", "Hiroshima Process Code of Conduct (Action 11)": "Organizations should also comply with applicable legal frameworks."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:115", "label": "Action 11", "caption": "53(1): Providers of general-purpose AI models shall: (d) draw up and make publicly available a sufficiently detailed summary about the content used for training of the general-purpose AI model, according to a template provided by the AI Office.", "color": "#a8bd57", "size": 2.8223999999999996, "props": {"number": "4", "Comments": "The CoC does not require the publication of details on training content.", "EU AI Act (GPAI focus)": "53(1): Providers of general-purpose AI models shall: (d) draw up and make publicly available a sufficiently detailed summary about the content used for training of the general-purpose AI model, according to a template provided by the AI Office.", "Point of Comparison": "Public training data summary", "Hiroshima Process Code of Conduct (Action 11)": "Nothing found"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:149", "label": "AIA", "caption": "Protected values, conformity mechanisms, and definition of advanced AI / general-purpose AI (with systemic  risk).", "color": "#57C7E3", "size": 1, "props": {"EU AI Act (GPAI focus)": "Protected values, conformity mechanisms, and definition of advanced AI / general-purpose AI (with systemic  risk).", "G7 Hiroshima AI Process Code of Conduct": "Intro: General and Introduction"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:150", "label": "AIA", "caption": "(112): Notifying AIO of models w/ systemic risk", "color": "#57C7E3", "size": 1, "props": {"EU AI Act (GPAI focus)": "(112): Notifying AIO of models w/ systemic risk", "G7 Hiroshima AI Process Code of Conduct": "Intro: General and Introduction"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:151", "label": "AIA", "caption": "(113): If EC becomes aware of a model with systemic risk, EC can designate it as such", "color": "#57C7E3", "size": 1, "props": {"EU AI Act (GPAI focus)": "(113): If EC becomes aware of a model with systemic risk, EC can designate it as such", "G7 Hiroshima AI Process Code of Conduct": "Intro: General and Introduction"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:152", "label": "AIA", "caption": "1(1): Subject matter", "color": "#57C7E3", "size": 1, "props": {"EU AI Act (GPAI focus)": "1(1): Subject matter", "G7 Hiroshima AI Process Code of Conduct": "9. Developing AI for the benefit of the public"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:153", "label": "AIA", "caption": "3(63): ‘general-purpose AI model’", "color": "#57C7E3", "size": 1, "props": {"EU AI Act (GPAI focus)": "3(63): ‘general-purpose AI model’", "G7 Hiroshima AI Process Code of Conduct": "Intro: General and Introduction"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:154", "label": "AIA", "caption": "3(64): ‘high-impact capabilities’", "color": "#57C7E3", "size": 1, "props": {"EU AI Act (GPAI focus)": "3(64): ‘high-impact capabilities’", "G7 Hiroshima AI Process Code of Conduct": "Intro: General and Introduction"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:155", "label": "AIA", "caption": "3(65): ‘systemic risk’", "color": "#57C7E3", "size": 1, "props": {"EU AI Act (GPAI focus)": "3(65): ‘systemic risk’", "G7 Hiroshima AI Process Code of Conduct": "11. Data input measures and protections for  personal data and intellectual property"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:156", "label": "AIA", "caption": "40: Harmonised standards and standardisation deliverables", "color": "#57C7E3", "size": 1, "props": {"EU AI Act (GPAI focus)": "40: Harmonised standards and standardisation deliverables", "G7 Hiroshima AI Process Code of Conduct": "Intro: General and Introduction"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:157", "label": "AIA", "caption": "41: Common specifications", "color": "#57C7E3", "size": 1, "props": {"EU AI Act (GPAI focus)": "41: Common specifications", "G7 Hiroshima AI Process Code of Conduct": "Intro: General and Introduction"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:158", "label": "AIA", "caption": "51: Classification rules for general-purpose AI model with systemic risk", "color": "#57C7E3", "size": 1, "props": {"EU AI Act (GPAI focus)": "51: Classification rules for general-purpose AI model with systemic risk", "G7 Hiroshima AI Process Code of Conduct": "Intro: General and Intr
