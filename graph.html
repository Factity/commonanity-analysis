act specifies which details. CoC prescribes evaluations for safety, security, and societal risks, as well as risks to human rights. AIA prescribes evaluations for systemic risk (55(1)(a)). Given the definition of systemic risk in 3(65), those are very similar. Similar to action 4", "EU AI Act (GPAI focus)": "53(1)(a): “draw up and keep up-to-date the technical documentation of the model, including its training and testing process and the results of its evaluation” [report to AIO] Annex XI(Section 2)(1): “A detailed description of the evaluation strategies, including evaluation results, on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies. Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification of limitations.”", "Point of Comparison": "Documentation of evaluations and red-teaming", "Hiroshima Process Code of Conduct (Action 3)": "“should include, for example: [...] Details of the evaluations conducted for potential safety, security, and societal risks, as well as risks to human rights” “should include, for example: [...] The results of red-teaming conducted to evaluate the model’s/system’s fitness for moving beyond the development stage.”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:64", "label": "Action 3", "caption": "Annex XI(Section 1): “The technical documentation referred to in Article 53(1), point (a) shall contain at least the following information as appropriate to the size and risk profile of the model: (1) A general description of the general-purpose AI model including: (a): the tasks that the model is intended to perform” Annex XI(Section 2)(1): “A detailed description of the evaluation strategies, including evaluation results, on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies. Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification of limitations.” 52(1): “Where a general-purpose AI model meets the condition referred to in Article 51(1), point (a), the relevant provider shall notify the Commission without delay and in any event within two weeks after that requirement is met or it becomes known that it will be met.” 51(1): “A general-purpose AI model shall be classified as a general-purpose AI model with systemic risk if it meets any of the following conditions: (a) it has high impact capabilities evaluated on the basis of appropriate technical tools and methodologies, including indicators and benchmarks; (b) based on a decision of the Commission, ex officio or following a qualified alert from the scientific panel, it has capabilities or an impact equivalent to those set out in point (a) having regard to the criteria set out in Annex XIII. (2) A general-purpose AI model shall be presumed to have high impact capabilities pursuant to paragraph 1, point (a), when the cumulative amount of computation used for its training measured in floating point operations is greater than 10^25. (3) The Commission shall adopt delegated acts in accordance with Article 97 to amend the thresholds listed in paragraphs 1 and 2 of this Article, as well as to supplement benchmarks and indicators in light of evolving technological developments, such as algorithmic improvements or increased hardware efficiency, when necessary, for these thresholds to reflect the state of the art.” Annex XIII(e): “the benchmarks and evaluations of capabilities of the model, including considering the number of tasks without additional training, adaptability to learn new, distinct tasks, its level of autonomy and scalability, the tools it has access to;” 53(1)(b)(i): “enable providers of AI systems to have a good understanding of the capabilities and limitations of the general-purpose AI model and to comply with their obligations pursuant to this Regulation” Annex XII: “The information referred to in Article 53(1), point (b) shall contain at least the following: (1): A general description of the general-purpose AI model including: (a) the tasks that the model is intended to perform and the type and nature of AI systems into which it can be integrated;”", "color": "#b3caa2", "size": 3.6864, "props": {"number": "4", "Comments": "1) The technical documentation for the AI Office according to Art. 53 & 55 (and Annex XI) does not require a reporting of model capacities/capabilities. There is medium commonality with two AIA sections: a) Annex XI requires the provider to report the tasks that the model is intended to perform. It also requires them to report a description of the methodology on the identification of limitations. It must also include the results of that identification of limitations. b) Art. 52(1) requires the provider to notify the EC if the GPAI model poses systemic risk, i.e., if it has high impact capabilities. However, the criterion used to classify models as having high impact capabilities is at present based on the amount of computation used for the model’s  training measured. Annex XIII, in particular (e), gives some broad categories of capabilities, e.g., autonomy  2) The technical documentation for downstream providers should enable providers of AI systems to have a good understanding of the capabilities and limitations of the general-purpose AI model (53(1)(a)). However, there is no prescription that the capabilities and limitations must be directly included in the documentation. Annex XII (Transparency information referred to in Article 53(1), point (b) - technical documentation for providers of general-purpose AI models to downstream providers that integrate the model into their AI system) says that the documentation must include the tasks that the model is intended to perform. Nothing more specific about capabilities and limitations can be found in Annex XII. Similar to Action 4", "EU AI Act (GPAI focus)": "Annex XI(Section 1): “The technical documentation referred to in Article 53(1), point (a) shall contain at least the following information as appropriate to the size and risk profile of the model: (1) A general description of the general-purpose AI model including: (a): the tasks that the model is intended to perform” Annex XI(Section 2)(1): “A detailed description of the evaluation strategies, including evaluation results, on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies. Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification of limitations.” 52(1): “Where a general-purpose AI model meets the condition referred to in Article 51(1), point (a), the relevant provider shall notify the Commission without delay and in any event within two weeks after that requirement is met or it becomes known that it will be met.” 51(1): “A general-purpose AI model shall be classified as a general-purpose AI model with systemic risk if it meets any of the following conditions: (a) it has high impact capabilities evaluated on the basis of appropriate technical tools and methodologies, including indicators and benchmarks; (b) based on a decision of the Commission, ex officio or following a qualified alert from the scientific panel, it has capabilities or an impact equivalent to those set out in point (a) having regard to the criteria set out in Annex XIII. (2) A general-purpose AI model shall be presumed to have high impact capabilities pursuant to paragraph 1, point (a), when the cumulative amount of computation used for its training measured in floating point operations is greater than 10^25. (3) The Commission shall adopt delegated acts in accordance with Article 97 to amend the thresholds listed in paragraphs 1 and 2 of this Article, as well as to supplement benchmarks and indicators in light of evolving technological developments, such as algorithmic improvements or increased hardware efficiency, when necessary, for these thresholds to reflect the state of the art.” Annex XIII(e): “the benchmarks and evaluations of capabilities of the model, including considering the number of tasks without additional training, adaptability to learn new, distinct tasks, its level of autonomy and scalability, the tools it has access to;” 53(1)(b)(i): “enable providers of AI systems to have a good understanding of the capabilities and limitations of the general-purpose AI model and to comply with their obligations pursuant to this Regulation” Annex XII: “The information referred to in Article 53(1), point (b) shall contain at least the following: (1): A general description of the general-purpose AI model including: (a) the tasks that the model is intended to perform and the type and nature of AI systems into which it can be integrated;”", "Point of Comparison": "Documentation contains capacities of the model/system", "Hiroshima Process Code of Conduct (Action 3)": "“should include, for example: [...] Capacities of a model/system and significant limitations in performance that have implications for the domains of appropriate use”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:65", "label": "Action 3", "caption": "56(2): “The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: [...] (d) the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof, which shall be proportionate to the risks, take into consideration their severity and probability and take into account the specific challenges of tackling those risks in light of the possible ways in which such risks may emerge and materialise along the AI value chain.” 91: ”The Commission may request the provider of the general-purpose AI model concerned to provide the documentation drawn up by the provider in accordance with Articles 53 and 55, or any additional information that is necessary for the purpose of assessing compliance of the provider with this Regulation.” 55(1): “In addition to the obligations listed in Articles 53 and 54, providers of general-purpose AI models with systemic risk shall: [...] (b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk;“", "color": "#b3caa2", "size": 3.6864, "props": {"number": "5", "Comments": "AIA has more clarity and requires documentation of the management of risks. Art. 56(2)(d) says that the codes of practice should cover the documentation of risk assessment and management of systemic risk. It leaves open what should be documented and who has access to the documentation, though it is assumed here to be the AI Office. Apart from that, according to Art. 91+55(1)(b), the EC can request information that is necessary to assess whether the provider does risk assessment. Please note that risk assessment in the CoC is about “risks to safety and society” whereas risk assessment in the AIA is about systemic risks at Union level. The definition of systemic risk in the AIA (Art. 3(65)) is broader than that of “risks to safety and society” in the CoC. Similar to action 4", "EU AI Act (GPAI focus)": "56(2): “The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: [...] (d) the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof, which shall be proportionate to the risks, take into consideration their severity and probability and take into account the specific challenges of tackling those risks in light of the possible ways in which such risks may emerge and materialise along the AI value chain.” 91: ”The Commission may request the provider of the general-purpose AI model concerned to provide the documentation drawn up by the provider in accordance with Articles 53 and 55, or any additional information that is necessary for the purpose of assessing compliance of the provider with this Regulation.” 55(1): “In addition to the obligations listed in Articles 53 and 54, providers of general-purpose AI models with systemic risk shall: [...] (b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk;“", "Point of Comparison": "Discussion and assessment of risks to safety or society", "Hiroshima Process Code of Conduct (Action 3)": "“should include, for example: [...] Discussion and assessment of the model’s or system’s effects and risks to safety and society such as harmful bias, discrimination, threats to protection of privacy or personal data, and effects on fairness”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:66", "label": "Action 3", "caption": "Annex XI(Section 1): “The technical  documentation referred to in Article 53(1),  point (a) shall contain at least the following  information [...]  (2) [...]  (a) the technical means (e.g. instructions of  use, infrastructure, tools) required for the general-purpose AI model to be integrated in  AI systems;”   5 3(1)(b): “the information and documentation  shall: (i) enable providers of AI systems to  have a good understanding of the capabilities  and limitations of the general-purpose AI  model and to comply with their obligations  pursuant to this Regulation;”   A nnex XI(section 2)(1): “A detailed  description of the evaluation strategies,  including evaluation results [...]”   N othing more specific found", "color": "#b3caa2", "size": 3.6864, "props": {"number": "6", "Comments": "AIA does not require reporting that  addresses users in order to make  sure that the model is used  appropriately. It only requires  reporting that addresses downstream  providers for the sake of integration  and compliance with the AIA. There are requirements regarding  clarity of reports in the CoC, while the  AIA has similar requirements  enabling a “good understanding” and  “to comply with their obligations”.", "EU AI Act (GPAI focus)": "Annex XI(Section 1): “The technical  documentation referred to in Article 53(1),  point (a) shall contain at least the following  information [...]  (2) [...]  (a) the technical means (e.g. instructions of  use, infrastructure, tools) required for the general-purpose AI model to be integrated in  AI systems;”   5 3(1)(b): “the information and documentation  shall: (i) enable providers of AI systems to  have a good understanding of the capabilities  and limitations of the general-purpose AI  model and to comply with their obligations  pursuant to this Regulation;”   A nnex XI(section 2)(1): “A detailed  description of the evaluation strategies,  including evaluation results [...]”   N othing more specific found", "Point of Comparison": "Clarity of reports to  enable interpretation  and appropriate  usage", "Hiroshima Process Code of Conduct (Action 3)": "“Organizations should make  the information in the  transparency reports  sufficiently clear and  understandable to enable  deployers and users as  appropriate and relevant to '“should include, for example: [...] Capacities of a model/system and significant limitations in performance that have implications for the domains of appropriate use”'\t'Annex XI(Section 1): “The technical documentation referred to in Article 53(1), point (a) shall contain at least the following information as appropriate to the size and risk profile of the model: (1) A general description of the general-purpose AI model including: (a): the tasks that the model is intended to perform” Annex XI(Section 2)(1): “A detailed description of the evaluation strategies, including evaluation results, on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies. Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification of limitations.” 52(1): “Where a general-purpose AI model meets the condition referred to in Article 51(1), point (a), the relevant provider shall notify the Commission without delay and in any event within two weeks after that requirement is met or it becomes known that it will be met.” 51(1): “A general-purpose AI model shall be classified as a general-purpose AI model with systemic risk if it meets any of the following conditions: (a) it has high impact capabilities evaluated on the basis of appropriate technical tools and methodologies, including indicators and benchmarks; (b) based on a decision of the Commission, ex officio or following a qualified alert from the scientific panel, it has capabilities or an impact equivalent to those set out in point (a) having regard to the criteria set out in Annex XIII. (2) A general-purpose AI model shall be presumed to have high impact capabilities pursuant to paragraph 1, point (a), when the cumulative amount of computation used for its training measured in floating point operations is greater than 10^25. (3) The Commission shall adopt delegated acts in accordance with Article 97 to amend the thresholds listed in paragraphs 1 and 2 of this Article, as well as to supplement benchmarks and indicators in light of evolving technological developments, such as algorithmic improvements or increased hardware efficiency, when necessary, for these thresholds to reflect the state of the art.” Annex XIII(e): “the benchmarks and evaluations of capabilities of the model, including considering the number of tasks without additional training, adaptability to learn new, distinct tasks, its level of autonomy and scalability, the tools it has access to;” 53(1)(b)(i): “enable providers of AI systems to have a good understanding of the capabilities and limitations of the general-purpose AI model and to comply with their obligations pursuant to this Regulation” Annex XII: “The information referred to in Article 53(1), point (b) shall contain at least the following: (1): A general description of the general-purpose AI model including: (a) the tasks that the model is intended to perform and the type and nature of AI systems into which it can be integrated;”'"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:67", "label": "Action 3", "caption": "53(1)(a): “draw up and keep up-to-date the  technical documentation of the model,  including its training and testing process and  the results of its evaluation, which shall  contain, at a minimum, the information set out  in Annex XI for the purpose of providing it,  upon request, to the AI Office and the national  competent authorities;”", "color": "#b3caa2", "size": 3.6864, "props": {"number": "7", "Comments": "In the AIA, the report that is targeted  towards the AIO is referred to as  technical documentation. Technical  information that must be included is  specified in Annex XI. Examples are  the architecture and the number of  parameters (section 1(1)(d)). The  CoC does not specify which specific  information the technical  documentation must contain. We  assume it should be similar.", "EU AI Act (GPAI focus)": "53(1)(a): “draw up and keep up-to-date the  technical documentation of the model,  including its training and testing process and  the results of its evaluation, which shall  contain, at a minimum, the information set out  in Annex XI for the purpose of providing it,  upon request, to the AI Office and the national  competent authorities;”", "Point of Comparison": "Technical  documentation", "Hiroshima Process Code of Conduct (Action 3)": "“transparency reporting should  be supported and informed by  robust documentation  processes such as  technical documentation and  instructions for use.”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:68", "label": "Action 3", "caption": "Annex XI(Section 1): “The technical  documentation referred to in Article 53(1),  point (a) shall contain at least the following  information [...]  (2) [...]  (a) the technical means (e.g. instructions of use, infrastructure, tools) required for the general-purpose AI model to be integrated in AI systems", "color": "#b3caa2", "size": 3.6864, "props": {"number": "8", "Comments": "The AIA, refers only to those  instructions of use that are required  for the general-purpose AI model to  be integrated in AI systems.The CoC  refers to instructions for use broadly.", "EU AI Act (GPAI focus)": "Annex XI(Section 1): “The technical  documentation referred to in Article 53(1),  point (a) shall contain at least the following  information [...]  (2) [...]  (a) the technical means (e.g. instructions of use, infrastructure, tools) required for the general-purpose AI model to be integrated in AI systems", "Point of Comparison": "Reports Contain  instructions for use", "Hiroshima Process Code of Conduct (Action 3)": "“transparency reporting should  be supported and informed by  robust documentation  processes such as technical  documentation and  instructions for use”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:69", "label": "Action 4", "caption": "55(1)(c): keep track of, document, and report, without undue delay, to the AI Office and, as appropriate, to national competent authorities, relevant information about serious incidents and possible corrective measures to address them. 53(3): shall cooperate as necessary with the Commission and the national competent authorities. 53(1): Providers of general-purpose AI models shall: (d) draw up and make publicly available a sufficiently detailed summary about the content used for training of the general-purpose AI model, according to a template provided by the AI Office.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "1", "Comments": "The CoC requires public reporting. The AIA requires three kinds of reports: 1) one report (which includes relevant information about serious incidents) upon request to the AI Office and the national competent authorities; 2) one report to providers that integrate the GPAI model; 3) one public report about the content used for training. Similar to action 3.", "EU AI Act (GPAI focus)": "55(1)(c): keep track of, document, and report, without undue delay, to the AI Office and, as appropriate, to national competent authorities, relevant information about serious incidents and possible corrective measures to address them. 53(3): shall cooperate as necessary with the Commission and the national competent authorities. 53(1): Providers of general-purpose AI models shall: (d) draw up and make publicly available a sufficiently detailed summary about the content used for training of the general-purpose AI model, according to a template provided by the AI Office.", "Point of Comparison": "Recipient of the shared information & reporting", "Hiroshima Process Code of Conduct (Action 4)": "Work towards responsible information sharing and reporting of incidents among organizations developing advanced AI systems including with industry, governments, civil society, and academia. Organizations should collaborate with other organizations across the AI lifecycle to share and report relevant information to the public. Organizations should also collaborate and share the aforementioned information with relevant public authorities, as appropriate."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:70", "label": "Action 4", "caption": "55(1)(c): keep track of, document, and report, without undue delay, to the AI Office and, as appropriate, to national competent authorities, relevant information about serious incidents and possible corrective measures to address them.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "2", "Comments": "CoC: reporting of incidents to many actors including industry, governments, civil society, and academia; AIA: reporting of relevant information about serious incidents to the AI Office.", "EU AI Act (GPAI focus)": "55(1)(c): keep track of, document, and report, without undue delay, to the AI Office and, as appropriate, to national competent authorities, relevant information about serious incidents and possible corrective measures to address them.", "Point of Comparison": "Incident reporting", "Hiroshima Process Code of Conduct (Action 4)": "Work towards reporting of incidents among organizations developing advanced AI systems including with industry, governments, civil society, and academia."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:71", "label": "Action 4", "caption": "53(1)(a): draw up and keep up-to-date the technical documentation of the model, including its training and testing process and the results of its evaluation. Annex XI(Section 2)(1): A detailed description of the evaluation strategies, including evaluation results, on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies. Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification of limitations. Annex XI(Section 2)(2): Where applicable, a detailed description of the measures put in place for the purpose of conducting internal and/or external adversarial testing (e.g., red teaming), model adaptations, including alignment and fine-tuning.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "3", "Comments": "AIA is more detailed and stringent than the CoC. While the CoC simply says details of the evaluations, the AIA act specifies which details. CoC prescribes evaluations for safety, security, and societal risks, as well as risks to human rights. AIA prescribes evaluations for systemic risk (55(1)(a)). Given the definition of systemic risk in 3(65), those are very similar. Similar to action 3.", "EU AI Act (GPAI focus)": "53(1)(a): draw up and keep up-to-date the technical documentation of the model, including its training and testing process and the results of its evaluation. Annex XI(Section 2)(1): A detailed description of the evaluation strategies, including evaluation results, on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies. Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification of limitations. Annex XI(Section 2)(2): Where applicable, a detailed description of the measures put in place for the purpose of conducting internal and/or external adversarial testing (e.g., red teaming), model adaptations, including alignment and fine-tuning.", "Point of Comparison": "Evaluation reports", "Hiroshima Process Code of Conduct (Action 4)": "This includes responsibly sharing information, as appropriate, including, but not limited to evaluation reports."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:72", "label": "Action 4", "caption": "91: The Commission may request the provider of the general-purpose AI model concerned to provide the documentation drawn up by the provider in accordance with Articles 53 and 55, or any additional information that is necessary for the purpose of assessing compliance of the provider with this Regulation. 55(1): In addition to the obligations listed in Articles 53 and 54, providers of general-purpose AI models with systemic risk shall: (b) assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "4", "Comments": "There is no prescription to universally share information on security and safety risks. However, according to Art. 91+55, the EC can request information that is necessary to assess whether the provider does risk assessment. Please note that risk assessment in the CoC is about risks to safety and society whereas risk assessment in the AIA is about systemic risks at Union level. The definition of systemic risk in the AIA (Art. 3(65)) is broader than that of risks to safety and society in the CoC. Similar to action 3.", "EU AI Act (GPAI focus)": "91: The Commission may request the provider of the general-purpose AI model concerned to provide the documentation drawn up by the provider in accordance with Articles 53 and 55, or any additional information that is necessary for the purpose of assessing compliance of the provider with this Regulation. 55(1): In addition to the obligations listed in Articles 53 and 54, providers of general-purpose AI models with systemic risk shall: (b) assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk.", "Point of Comparison": "Information on security and safety risks", "Hiroshima Process Code of Conduct (Action 4)": "This includes responsibly sharing information, as appropriate, including, but not limited to information on security and safety risks."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:73", "label": "Action 4", "caption": "Annex XI(1): A general description of the general-purpose AI model including: (a) the tasks that the model is intended to perform and the type and nature of AI systems in which it can be integrated. 53(1)(b)(i): enable providers of AI systems to have a good understanding of the capabilities and limitations of the general-purpose AI model and to comply with their obligations pursuant to this Regulation. 52(1): Where a general-purpose AI model meets the condition referred to in Article 51(1), point (a), the relevant provider shall notify the Commission without delay and in any event within two weeks after that requirement is met or it becomes known that it will be met. Annex XIII(e): the benchmarks and evaluations of capabilities of the model, including considering the number of tasks without additional training, adaptability to learn new, distinct tasks, its level of autonomy and scalability, the tools it has access to.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "5", "Comments": "AIA report to the AI Office: Only the tasks that the model is intended to perform must be included. Nothing about dangerous capabilities. If dangerous capabilities are not intended, then they are excluded from the documentation. AIA report to downstream providers: As in the report to the AI Office, the tasks that the model is intended to perform must be included. Additionally there is a more indirect prescription: The report must enable downstream providers to have a good understanding of the capabilities and limitations of the system. However, it is not specified how this should be achieved. Furthermore, 52(1) requires the provider to notify the EC if the GPAI model poses systemic risk, i.e., if it has high impact capabilities. However, the criterion used to classify models as having high impact capabilities is at present based on the amount of computation used for the model's training measured. Annex XIII, in particular (e), gives some broad categories of capabilities, e.g., autonomy. Similar to action 3.", "EU AI Act (GPAI focus)": "Annex XI(1): A general description of the general-purpose AI model including: (a) the tasks that the model is intended to perform and the type and nature of AI systems in which it can be integrated. 53(1)(b)(i): enable providers of AI systems to have a good understanding of the capabilities and limitations of the general-purpose AI model and to comply with their obligations pursuant to this Regulation. 52(1): Where a general-purpose AI model meets the condition referred to in Article 51(1), point (a), the relevant provider shall notify the Commission without delay and in any event within two weeks after that requirement is met or it becomes known that it will be met. Annex XIII(e): the benchmarks and evaluations of capabilities of the model, including considering the number of tasks without additional training, adaptability to learn new, distinct tasks, its level of autonomy and scalability, the tools it has access to.", "Point of Comparison": "Information on dangerous intended or unintended capabilities", "Hiroshima Process Code of Conduct (Action 4)": "This includes responsibly sharing information, as appropriate, including, but not limited to information on dangerous intended or unintended capabilities."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:74", "label": "Action 4", "caption": "55(1)(c): keep track of, document, and report, without undue delay, to the AI Office and, as appropriate, to national competent authorities, relevant information about serious incidents and possible corrective measures to address them. 3(49): serious incident means an incident or malfunctioning of an AI system that directly or indirectly leads to any of the following: (a) the death of a person, or serious harm to a person's health; (b) a serious and irreversible disruption of the management or operation of critical infrastructure; (c) the infringement of obligations under Union law intended to protect fundamental rights; (d) serious harm to property or the environment. Nothing specific found about attempts to circumvent safeguards or attempts to cause incidents.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "6", "Comments": "According to the AIA, only serious incidents must be reported. Serious incidents are defined by having certain consequences. So, attempts do not count as serious incidents. Therefore, this CoC obligation is not covered by the AIA. However, while it's not strictly in the AIA, one could interpret that providers should still keep track of circumvention attempts, as a best practice for risk assessment.", "EU AI Act (GPAI focus)": "55(1)(c): keep track of, document, and report, without undue delay, to the AI Office and, as appropriate, to national competent authorities, relevant information about serious incidents and possible corrective measures to address them. 3(49): serious incident means an incident or malfunctioning of an AI system that directly or indirectly leads to any of the following: (a) the death of a person, or serious harm to a person's health; (b) a serious and irreversible disruption of the management or operation of critical infrastructure; (c) the infringement of obligations under Union law intended to protect fundamental rights; (d) serious harm to property or the environment. Nothing specific found about attempts to circumvent safeguards or attempts to cause incidents.", "Point of Comparison": "Information on attempts by AI actors to circumvent safeguards", "Hiroshima Process Code of Conduct (Action 4)": "This includes responsibly sharing information, as appropriate, including, but not limited to information on attempts by AI actors to circumvent safeguards."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:75", "label": "Action 4", "caption": "(139): the AI regulatory sandboxes should aim to enhance legal certainty for innovators and the competent authorities' oversight and understanding of the opportunities, emerging risks and the impacts of AI use, to facilitate regulatory learning for authorities and undertakings, including with a view to future adaptions of the legal framework, to support cooperation and the sharing of best practices with the authorities involved in the AI regulatory sandbox. 40(3): The participants in the standardisation process shall seek to promote investment and innovation in AI, including through increasing legal certainty as well as the competitiveness and growth of the Union market, to contribute to strengthening global cooperation on standardisation and taking into account existing international standards in the field of AI that are consistent with Union values, fundamental rights and interests, and to enhance multi-stakeholder governance ensuring a balanced representation of interests and the effective participation of all relevant stakeholders. 56(3): The AI Office may invite all providers of general-purpose AI models to participate in the drawing-up of codes of practice. 62(1)(d): Member States shall facilitate the participation of SMEs and other relevant stakeholders in the standardisation development process.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "7", "Comments": "The AIA encourages the sharing of best practices in regulatory sandboxes. While the AIA does not strictly require providers to work to develop standards, it is in their interest to do so and they are, in theory, invited and facilitated to do so by authorities.", "EU AI Act (GPAI focus)": "(139): the AI regulatory sandboxes should aim to enhance legal certainty for innovators and the competent authorities' oversight and understanding of the opportunities, emerging risks and the impacts of AI use, to facilitate regulatory learning for authorities and undertakings, including with a view to future adaptions of the legal framework, to support cooperation and the sharing of best practices with the authorities involved in the AI regulatory sandbox. 40(3): The participants in the standardisation process shall seek to promote investment and innovation in AI, including through increasing legal certainty as well as the competitiveness and growth of the Union market, to contribute to strengthening global cooperation on standardisation and taking into account existing international standards in the field of AI that are consistent with Union values, fundamental rights and interests, and to enhance multi-stakeholder governance ensuring a balanced representation of interests and the effective participation of all relevant stakeholders. 56(3): The AI Office may invite all providers of general-purpose AI models to participate in the drawing-up of codes of practice. 62(1)(d): Member States shall facilitate the participation of SMEs and other relevant stakeholders in the standardisation development process.", "Point of Comparison": "Development of shared standards, tools, mechanisms, and best practices", "Hiroshima Process Code of Conduct (Action 4)": "Organizations should establish or join mechanisms to develop, advance, and adopt, where appropriate, shared standards, tools, mechanisms, and best practices for ensuring the safety, security, and trustworthiness of advanced AI systems."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:76", "label": "Action 4", "caption": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. Annex XI(Section 1)(2): A detailed description of the elements of the model referred to in point 1, and relevant information of the process for the development, including the following elements: (a) the technical means (e.g. instructions of use, infrastructure, tools) required for the general-purpose AI model to be integrated in AI systems; (b) the design specifications of the model and training process, including training methodologies and techniques, the key design choices including the rationale and assumptions made; what the model is designed to optimise for and the relevance of the different parameters, as applicable; (c) information on the data used for training, testing and validation, where applicable, including the type and provenance of data and curation methodologies (e.g. cleaning, filtering, etc.), the number of data points, their scope and main characteristics; how the data was obtained and selected as well as all other measures to detect the unsuitability of data sources and methods to detect identifiable biases, where applicable; (d) the computational resources used to train the model (e.g. number of floating point operations), training time, and other relevant details related to the training; (e) known or estimated energy consumption of the model. With regard to point (e), where the energy consumption of the model is unknown, the energy consumption may be based on information about computational resources used.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "8", "Comments": "Annex XI(section 1)(2) covers elements from the whole lifecycle: design, training, testing, validation, integration, and deployment. Furthermore, risk assessment of systemic risks must be done during all stages of the lifecycle.", "EU AI Act (GPAI focus)": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. Annex XI(Section 1)(2): A detailed description of the elements of the model referred to in point 1, and relevant information of the process for the development, including the following elements: (a) the technical means (e.g. instructions of use, infrastructure, tools) required for the general-purpose AI model to be integrated in AI systems; (b) the design specifications of the model and training process, including training methodologies and techniques, the key design choices including the rationale and assumptions made; what the model is designed to optimise for and the relevance of the different parameters, as applicable; (c) information on the data used for training, testing and validation, where applicable, including the type and provenance of data and curation methodologies (e.g. cleaning, filtering, etc.), the number of data points, their scope and main characteristics; how the data was obtained and selected as well as all other measures to detect the unsuitability of data sources and methods to detect identifiable biases, where applicable; (d) the computational resources used to train the model (e.g. number of floating point operations), training time, and other relevant details related to the training; (e) known or estimated energy consumption of the model. With regard to point (e), where the energy consumption of the model is unknown, the energy consumption may be based on information about computational resources used.", "Point of Comparison": "Across the AI lifecycle", "Hiroshima Process Code of Conduct (Action 4)": "ensuring appropriate and relevant documentation and transparency across the AI lifecycle."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:77", "label": "Action 4", "caption": "55(1): In addition to the obligations listed in Articles 53 and 54, providers of general-purpose AI models with systemic risk shall: (a) perform model evaluation in accordance with standardised protocols and tools reflecting the state of the art, including conducting and documenting adversarial testing of the model with a view to identifying and mitigating systemic risks; (b) assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk; (c) keep track of, document, and report without undue delay, to the AI Office and, as appropriate, to national competent authorities, relevant information about serious incidents and possible corrective measures to address them; (d) ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model. 2. Providers of general-purpose AI models with systemic risk may rely on codes of practice within the meaning of Article 56 to demonstrate compliance with the obligations set out in paragraph 1 of this Article, until a harmonised standard is published. Compliance with European harmonised standards grants providers the presumption of conformity to the extent that those standards cover those obligations. Providers of general-purpose AI models with systemic risks who do not adhere to an approved code of practice or do not comply with a European harmonised standard shall demonstrate alternative adequate means of compliance for assessment by the Commission. 3. Any information or documentation obtained pursuant to this Article, including trade secrets, shall be treated in accordance with the confidentiality obligations set out in Article 78.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "9", "Comments": "Both focus more on riskier models. CoC: in particular for risks to safety and health. AIA: more exhaustive reporting for GPAI models with systemic risk.", "EU AI Act (GPAI focus)": "55(1): In addition to the obligations listed in Articles 53 and 54, providers of general-purpose AI models with systemic risk shall: (a) perform model evaluation in accordance with standardised protocols and tools reflecting the state of the art, including conducting and documenting adversarial testing of the model with a view to identifying and mitigating systemic risks; (b) assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk; (c) keep track of, document, and report without undue delay, to the AI Office and, as appropriate, to national competent authorities, relevant information about serious incidents and possible corrective measures to address them; (d) ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model. 2. Providers of general-purpose AI models with systemic risk may rely on codes of practice within the meaning of Article 56 to demonstrate compliance with the obligations set out in paragraph 1 of this Article, until a harmonised standard is published. Compliance with European harmonised standards grants providers the presumption of conformity to the extent that those standards cover those obligations. Providers of general-purpose AI models with systemic risks who do not adhere to an approved code of practice or do not comply with a European harmonised standard shall demonstrate alternative adequate means of compliance for assessment by the Commission. 3. Any information or documentation obtained pursuant to this Article, including trade secrets, shall be treated in accordance with the confidentiality obligations set out in Article 78.", "Point of Comparison": "Advanced AI systems that cause significant risks to safety and society", "Hiroshima Process Code of Conduct (Action 4)": "in particular for advanced AI systems that cause significant risks to safety and society."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:78", "label": "Action 4", "caption": "53(3): Providers of general-purpose AI models shall cooperate as necessary with the Commission and the national competent authorities in the exercise of their competences and powers pursuant to this Regulation. (114) In addition, providers of general-purpose AI models with systemic risks should continuously assess and mitigate systemic risks, including for example by putting in place risk-management policies, such as accountability and governance processes, implementing post-market monitoring, taking appropriate measures along the entire model's lifecycle and cooperating with relevant actors along the AI value chain.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "10", "Comments": "AIA: 1) cooperation as necessary with EC and national competent authorities; 2) cooperating with relevant actors along the AI value chain in risk mitigation and assessment (see Action 3, entry 6 on the reporting of risk assessment).", "EU AI Act (GPAI focus)": "53(3): Providers of general-purpose AI models shall cooperate as necessary with the Commission and the national competent authorities in the exercise of their competences and powers pursuant to this Regulation. (114) In addition, providers of general-purpose AI models with systemic risks should continuously assess and mitigate systemic risks, including for example by putting in place risk-management policies, such as accountability and governance processes, implementing post-market monitoring, taking appropriate measures along the entire model's lifecycle and cooperating with relevant actors along the AI value chain.", "Point of Comparison": "Collaboration", "Hiroshima Process Code of Conduct (Action 4)": "Organizations should collaborate with other organizations across the AI lifecycle to share and report relevant information to the public with a view to advancing safety, security and trustworthiness of advanced AI systems. Organizations should also collaborate and share the aforementioned information with relevant public authorities, as appropriate."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:79", "label": "Action 4", "caption": "78(1): The Commission, market surveillance authorities and notified bodies and any other natural or legal person involved in the application of this Regulation shall, in accordance with Union or national law, respect the confidentiality of information and data obtained in carrying out their tasks and activities in such a manner as to protect, in particular: (a) the intellectual property rights and confidential business information or trade secrets of a natural or legal person, including source code, except in the cases referred to in Article 5 of Directive (EU) 2016/943 of the European Parliament and of the Council. 52(6): The Commission shall ensure that a list of general-purpose AI models with systemic risk is published and shall keep that list up to date, without prejudice to the need to observe and protect intellectual property rights and confidential business information or trade secrets in accordance with Union and national law. (167): In order to ensure trustful and constructive cooperation of competent authorities on Union and national level, all parties involved in the application of this Regulation should respect the confidentiality of information and data obtained in carrying out their tasks, in accordance with Union or national law. They should carry out their tasks and activities in such a manner as to protect, in particular, intellectual property rights, confidential business information and trade secrets, the effective implementation of this Regulation, public and national security interests, the integrity of criminal and administrative proceedings, and the integrity of classified information.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "11", "Comments": "AIA includes everything from CoC and is even broader.", "EU AI Act (GPAI focus)": "78(1): The Commission, market surveillance authorities and notified bodies and any other natural or legal person involved in the application of this Regulation shall, in accordance with Union or national law, respect the confidentiality of information and data obtained in carrying out their tasks and activities in such a manner as to protect, in particular: (a) the intellectual property rights and confidential business information or trade secrets of a natural or legal person, including source code, except in the cases referred to in Article 5 of Directive (EU) 2016/943 of the European Parliament and of the Council. 52(6): The Commission shall ensure that a list of general-purpose AI models with systemic risk is published and shall keep that list up to date, without prejudice to the need to observe and protect intellectual property rights and confidential business information or trade secrets in accordance with Union and national law. (167): In order to ensure trustful and constructive cooperation of competent authorities on Union and national level, all parties involved in the application of this Regulation should respect the confidentiality of information and data obtained in carrying out their tasks, in accordance with Union or national law. They should carry out their tasks and activities in such a manner as to protect, in particular, intellectual property rights, confidential business information and trade secrets, the effective implementation of this Regulation, public and national security interests, the integrity of criminal and administrative proceedings, and the integrity of classified information.", "Point of Comparison": "Safeguarding intellectual property rights", "Hiroshima Process Code of Conduct (Action 4)": "Such reporting should safeguard intellectual property rights."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:80", "label": "Action 4", "caption": "(172): Persons acting as whistleblowers on the infringements of this Regulation should be protected under the Union law. Directive (EU) 2019/1937 of the European Parliament and of the Council (54) should therefore apply to the reporting of infringements of this Regulation and the protection of persons reporting such infringements.", "color": "#f506fe", "size": 2.8223999999999996, "props": {"number": "12", "Comments": "Nothing in the CoC on whistleblower reporting protection.", "EU AI Act (GPAI focus)": "(172): Persons acting as whistleblowers on the infringements of this Regulation should be protected under the Union law. Directive (EU) 2019/1937 of the European Parliament and of the Council (54) should therefore apply to the reporting of infringements of this Regulation and the protection of persons reporting such infringements.", "Point of Comparison": "Whistleblowing", "Hiroshima Process Code of Conduct (Action 4)": "Not found"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:81", "label": "Action 5", "caption": "55(1)(b): assess and mitigate possible systemic risks. 56(2): The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: (d): the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof, which shall be proportionate to the risks, take into consideration their severity and probability and take into account the specific challenges of tackling those risks in light of the possible ways in which such risks may emerge and materialise along the AI value chain. (114): continuously assess and mitigate systemic risks, including for example by putting in place risk-management policies, such as accountability and governance processes, implementing post-market monitoring, taking appropriate measures along the entire model's lifecycle and cooperating with relevant actors along the AI value chain. Annex XI(Section 2)(1): A detailed description of the evaluation strategies, including evaluation results, on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies. Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification of limitations. Annex XI(Section 2)(2): Where applicable, a detailed description of the measures put in place for the purpose of conducting internal and/or external adversarial testing (e.g. red teaming), model adaptations, including alignment and fine-tuning.", "color": "#fb83ad", "size": 2.8223999999999996, "props": {"number": "1", "Comments": "Action 5 is very similar to Recital 114. Also, standards for assessing and mitigating risks usually necessitate such policies, so there is almost certainly a need for such policies. There is no public disclosure of such policies required by the AIA, but evaluations, adversarial testing, and model adaptations must be disclosed to the AI Office if requested and are forms of risk assessment and mitigation. 'Develop' could not be found in the AIA.", "EU AI Act (GPAI focus)": "55(1)(b): assess and mitigate possible systemic risks. 56(2): The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: (d): the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof, which shall be proportionate to the risks, take into consideration their severity and probability and take into account the specific challenges of tackling those risks in light of the possible ways in which such risks may emerge and materialise along the AI value chain. (114): continuously assess and mitigate systemic risks, including for example by putting in place risk-management policies, such as accountability and governance processes, implementing post-market monitoring, taking appropriate measures along the entire model's lifecycle and cooperating with relevant actors along the AI value chain. Annex XI(Section 2)(1): A detailed description of the evaluation strategies, including evaluation results, on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies. Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification of limitations. Annex XI(Section 2)(2): Where applicable, a detailed description of the measures put in place for the purpose of conducting internal and/or external adversarial testing (e.g. red teaming), model adaptations, including alignment and fine-tuning.", "Point of Comparison": "AI governance and risk management policies", "Hiroshima Process Code of Conduct (Action 5)": "Develop, implement and disclose AI governance and risk management policies."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:82", "label": "Action 5", "caption": "55(1)(b): assess and mitigate possible systemic risks. (114): continuously assess and mitigate systemic risks, including for example by putting in place risk-management policies, such as accountability and governance processes, implementing post-market monitoring, taking appropriate measures along the entire model's lifecycle and cooperating with relevant actors along the AI value chain.", "color": "#fb83ad", "size": 2.8223999999999996, "props": {"number": "2", "Comments": "CoC is more explicit. Action 5 is similar to Recital 114. Also, standards for assessing and mitigating risks usually necessitate such policies, so there is almost certainly a need for such policies. However, 'develop' and 'disclose' could not be found in the AIA. Also, the AIA does not directly require such mechanisms, though they are needed to fulfil the AIA's risk management requirements.", "EU AI Act (GPAI focus)": "55(1)(b): assess and mitigate possible systemic risks. (114): continuously assess and mitigate systemic risks, including for example by putting in place risk-management policies, such as accountability and governance processes, implementing post-market monitoring, taking appropriate measures along the entire model's lifecycle and cooperating with relevant actors along the AI value chain.", "Point of Comparison": "Organizational mechanisms", "Hiroshima Process Code of Conduct (Action 5)": "Organizations should put in place appropriate organizational mechanisms to develop, disclose and implement risk management and governance policies, including for example accountability and governance processes to identify, assess, prevent, and address risks, where feasible throughout the AI lifecycle."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:83", "label": "Action 5", "caption": "(28): Aside from the many beneficial uses of AI, it can also be misused and provide novel and powerful tools for manipulative, exploitative and social control practices. Such practices are particularly harmful and abusive and should be prohibited because they contradict Union values of respect for human dignity, freedom, equality, democracy and the rule of law and fundamental rights enshrined in the Charter, including the right to non-discrimination, to data protection and to privacy and the rights of the child. (110): [recital on systemic risks] the facilitation of disinformation or harming privacy with threats to democratic values and human rights. 3(65): systemic risk means a risk that is specific to the high-impact capabilities of general-purpose AI models, having a significant impact on the Union market due to their reach, or due to actual or reasonably foreseeable negative effects on public health, safety, public security, fundamental rights, or the society as a whole, that can be propagated at scale across the value chain. 55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk.", "color": "#fb83ad", "size": 2.8223999999999996, "props": {"number": "3", "Comments": "CoC is more explicit. Systemic risks must be mitigated, including risks to fundamental rights, which in turn includes the right to privacy. Also, Recital 110 on GPAI systemic risks explicitly lists harms to privacy. Therefore disclosing privacy policies could be prudent as a risk mitigation measure under the AIA. Other EU regulations may be more relevant to the CoC text on privacy policies.", "EU AI Act (GPAI focus)": "(28): Aside from the many beneficial uses of AI, it can also be misused and provide novel and powerful tools for manipulative, exploitative and social control practices. Such practices are particularly harmful and abusive and should be prohibited because they contradict Union values of respect for human dignity, freedom, equality, democracy and the rule of law and fundamental rights enshrined in the Charter, including the right to non-discrimination, to data protection and to privacy and the rights of the child. (110): [recital on systemic risks] the facilitation of disinformation or harming privacy with threats to democratic values and human rights. 3(65): systemic risk means a risk that is specific to the high-impact capabilities of general-purpose AI models, having a significant impact on the Union market due to their reach, or due to actual or reasonably foreseeable negative effects on public health, safety, public security, fundamental rights, or the society as a whole, that can be propagated at scale across the value chain. 55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk.", "Point of Comparison": "Privacy policies", "Hiroshima Process Code of Conduct (Action 5)": "This includes disclosing where appropriate privacy policies, including for personal data, user prompts and advanced AI system outputs."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:84", "label": "Action 5", "caption": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. (114): continuously assess and mitigate systemic risks, including for example by putting in place risk-management policies, such as accountability and governance processes, implementing post-market monitoring, taking appropriate measures along the entire model's lifecycle and cooperating with relevant actors along the AI value chain.", "color": "#fb83ad", "size": 2.8223999999999996, "props": {"number": "4", "Comments": "CoC is more explicit. The AIA does not require public disclosure of these policies, assuming this is the intention of the CoC.", "EU AI Act (GPAI focus)": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. (114): continuously assess and mitigate systemic risks, including for example by putting in place risk-management policies, such as accountability and governance processes, implementing post-market monitoring, taking appropriate measures along the entire model's lifecycle and cooperating with relevant actors along the AI value chain.", "Point of Comparison": "Establish and disclose AI governance policies and mechanisms", "Hiroshima Process Code of Conduct (Action 5)": "Organizations are expected to establish and disclose their AI governance policies and organizational mechanisms to implement these policies in accordance with a risk-based approach. This should include accountability and governance processes to evaluate and mitigate risks, where feasible throughout the AI lifecycle."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:85", "label": "Action 5", "caption": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. 56(2): The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: (d): the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof, which shall be proportionate to the risks, take into consideration their severity and probability and take into account the specific challenges of tackling those risks in light of the possible ways in which such risks may emerge and materialise along the AI value chain.", "color": "#fb83ad", "size": 2.8223999999999996, "props": {"number": "5", "Comments": "CoC is more explicit. If one assumes that policies are needed to manage risk, then these are essentially the same. Only the CoC explicitly requires regular updates, but these are needed to address risk throughout the AI lifecycle, including those that may materialise along the AI value chain.", "EU AI Act (GPAI focus)": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. 56(2): The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: (d): the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof, which shall be proportionate to the risks, take into consideration their severity and probability and take into account the specific challenges of tackling those risks in light of the possible ways in which such risks may emerge and materialise along the AI value chain.", "Point of Comparison": "Development and update of risk management policies", "Hiroshima Process Code of Conduct (Action 5)": "The risk management policies should be developed in accordance with a risk-based approach and apply a risk management framework across the AI lifecycle as appropriate and relevant, to address the range of risks associated with AI systems, and policies should also be regularly updated."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:86", "label": "Action 5", "caption": "4: [AI literacy]. 9(5)(c): [Training to deployers]. 14(5): [Human oversight]. 26(2): [Deployers - training and authority of human oversight]. 60(4)(i): [Testing of high-risk outside of sandboxes - training and authority].", "color": "#fb83ad", "size": 2.8223999999999996, "props": {"number": "6", "Comments": "CoC is more explicit. This is good practice in risk management, but not explicitly stated for GPAI model providers. There are similar requirements for high-risk AI systems however.", "EU AI Act (GPAI focus)": "4: [AI literacy]. 9(5)(c): [Training to deployers]. 14(5): [Human oversight]. 26(2): [Deployers - training and authority of human oversight]. 60(4)(i): [Testing of high-risk outside of sandboxes - training and authority].", "Point of Comparison": "Policies, procedures and training for staff", "Hiroshima Process Code of Conduct (Action 5)": "Organizations should establish policies, procedures, and training to ensure that staff are familiar with their duties and the organization's risk management practices."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:87", "label": "Action 6", "caption": "55(1)(d): ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model. 56(2): The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: (d): the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof, which shall be proportionate to the risks, take into consideration their severity and probability and take into account the specific challenges of tackling those risks in light of the possible ways in which such risks may emerge and materialise along the AI value chain. (115): [Cybersecurity protection] could be facilitated by [controls] appropriate to the relevant circumstances and the risks involved.", "color": "#e70b4e", "size": 3.6864, "props": {"number": "1", "Comments": "CoC and AIA both require cybersecurity to be 'adequate'. CoC also uses 'robust', 'appropriate', and 'suitable', while the AIA uses 'proportionate' (normative) and 'appropriate' (recital). The AIA does not explicitly require investment, though this is typically necessary to 'ensure an adequate level of cybersecurity protection'.", "EU AI Act (GPAI focus)": "55(1)(d): ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model. 56(2): The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: (d): the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof, which shall be proportionate to the risks, take into consideration their severity and probability and take into account the specific challenges of tackling those risks in light of the possible ways in which such risks may emerge and materialise along the AI value chain. (115): [Cybersecurity protection] could be facilitated by [controls] appropriate to the relevant circumstances and the risks involved.", "Point of Comparison": "Level of controls / measures / protection", "Hiroshima Process Code of Conduct (Action 6)": "Invest in and implement robust security controls. Ensure that the cybersecurity of advanced AI systems is appropriate to the relevant circumstances and the risks involved. Regularly review security measures to ensure they are maintained to a high standard and remain suitable to address risks."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:88", "label": "Action 6", "caption": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market or the use of general-purpose AI models with systemic risk.", "color": "#e70b4e", "size": 3.6864, "props": {"number": "2", "Comments": "Equivalent", "EU AI Act (GPAI focus)": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market or the use of general-purpose AI models with systemic risk.", "Point of Comparison": "Lifecycle", "Hiroshima Process Code of Conduct (Action 6)": "across the AI lifecycle"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:89", "label": "Action 6", "caption": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. (115): Cybersecurity protection related to systemic risks associated with malicious use or attacks should duly consider [list of threats].", "color": "#e70b4e", "size": 3.6864, "props": {"number": "3", "Comments": "CoC explicitly requires a cybersecurity risk assessment, while the AIA reasonably requires one, as inadequate cybersecurity is a source of risk.", "EU AI Act (GPAI focus)": "55(1)(b): assess and mitigate possible systemic risks at Union level, including their sources, that may stem from the development, the placing on the market, or the use of general-purpose AI models with systemic risk. (115): Cybersecurity protection related to systemic risks associated with malicious use or attacks should duly consider [list of threats].", "Point of Comparison": "Cybersecurity risk assessment", "Hiroshima Process Code of Conduct (Action 6)": "performing an assessment of cybersecurity risks"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:90", "label": "Action 6", "caption": "(115): securing model weights, algorithms, servers, and data sets, such as through operational security measures for information security, specific cybersecurity policies, adequate technical and established solutions, and cyber and physical access controls.", "color": "#e70b4e", "size": 3.6864, "props": {"number": "4", "Comments": "Slight differences in adjectives (e.g., 'appropriate', 'specific').", "EU AI Act (GPAI focus)": "(115): securing model weights, algorithms, servers, and data sets, such as through operational security measures for information security, specific cybersecurity policies, adequate technical and established solutions, and cyber and physical access controls.", "Point of Comparison": "Example controls", "Hiroshima Process Code of Conduct (Action 6)": "securing model weights and algorithms, servers, and datasets, such as through operational security measures for information security and appropriate cyber/physical access controls. ...cybersecurity policies and adequate technical and institutional solutions"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:91", "label": "Action 6", "caption": "55(1)(d): ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model. (115): That protection could be facilitated by...physical access controls.", "color": "#e70b4e", "size": 3.6864, "props": {"number": "5", "Comments": "Both require controls for physical security.", "EU AI Act (GPAI focus)": "55(1)(d): ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model. (115): That protection could be facilitated by...physical access controls.", "Point of Comparison": "Physical infrastructure", "Hiroshima Process Code of Conduct (Action 6)": "implement robust security controls, including physical security"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:92", "label": "Action 6", "caption": "55(1)(d): ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model. (115): providers should ensure an adequate level of cybersecurity protection for the model and its physical infrastructure, if appropriate. (115): Cybersecurity protection related to systemic risks associated with malicious use or attacks should duly consider...unauthorised releases...unauthorised access.", "color": "#e70b4e", "size": 3.6864, "props": {"number": "6", "Comments": "Essentially the same.", "EU AI Act (GPAI focus)": "55(1)(d): ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model. (115): providers should ensure an adequate level of cybersecurity protection for the model and its physical infrastructure, if appropriate. (115): Cybersecurity protection related to systemic risks associated with malicious use or attacks should duly consider...unauthorised releases...unauthorised access.", "Point of Comparison": "Secure environment", "Hiroshima Process Code of Conduct (Action 6)": "Organizations should also have in place measures to require storing and working with the model weights of advanced AI systems in an appropriately secure environment with limited access to reduce both the risk of unsanctioned release and the risk of unauthorized access."}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:93", "label": "Action 6", "caption": "56(2): The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: (d): the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof. (115): That protection could be facilitated by securing model weights, algorithms, servers, and data sets, such as through...adequate technical and established solutions.", "color": "#e70b4e", "size": 3.6864, "props": {"number": "7", "Comments": "The AIA does not explicitly require or discuss a 'vulnerability management process', though it can be considered a specific example of 'documentation' and an 'adequate technical and established solution' for cybersecurity.", "EU AI Act (GPAI focus)": "56(2): The AI Office and the Board shall aim to ensure that the codes of practice cover at least the obligations provided for in Articles 53 and 55, including the following issues: (d): the measures, procedures and modalities for the assessment and management of the systemic risks at Union level, including the documentation thereof. (115): That protection could be facilitated by securing model weights, algorithms, servers, and data sets, such as through...adequate technical and established solutions.", "Point of Comparison": "Vulnerability management process", "Hiroshima Process Code of Conduct (Action 6)": "commitment to have in place a vulnerability management process"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:94", "label": "Action 6", "caption": "55(1)(d): ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model.", "color": "#e70b4e", "size": 3.6864, "props": {"number": "8", "Comments": "CoC is explicit about regular review and maintenance of security measures, while it can be reasonably inferred from the AIA as being necessary.", "EU AI Act (GPAI focus)": "55(1)(d): ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model.", "Point of Comparison": "Regular review", "Hiroshima Process Code of Conduct (Action 6)": "regularly review security measures to ensure they are maintained to a high standard and remain suitable to address risks"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:95", "label": "Action 6", "caption": "(115): protection could be facilitated by...operational security measures for information security.", "color": "#e70b4e", "size": 3.6864, "props": {"number": "9", "Comments": "Both mention opsec (recital in AIA), but only CoC specifically discusses insider threat controls.", "EU AI Act (GPAI focus)": "(115): protection could be facilitated by...operational security measures for information security.", "Point of Comparison": "Insider threats", "Hiroshima Process Code of Conduct (Action 6)": "implement robust security controls, including...insider threat safeguards. Establishing a robust insider threat detection program consistent with protections provided for their most valuable intellectual property and trade secrets, for example, by limiting access to proprietary and unreleased model weights. operational security measures for information security"}}, {"id": "4:bddc
