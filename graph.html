<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph Explorer</title>
<style>
:root{
  /* yellow‑warm dark palette */
  --bg-canvas:#0e0d0a;
  --bg-panel:#1a1913;
  --bg-panel-2:#222118;
  --bg-elevated:#2a281c;
  --border:#3d3a28;
  --border-soft:#2a281c;
  --text:#f0ecd8;
  --text-dim:#b0a98c;
  --text-faint:#70694e;
  --accent:#f5c542;
  --accent-dim:#5c4a1f;
  --danger:#e26565;
  --radius:8px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font);
  background:var(--bg-canvas);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{
  display:flex;
  flex-direction:column;
  height:100vh;
  width:100vw;
}

/* ---------- Top bar ---------- */
#topbar{
  height:56px;
  min-height:56px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 16px;
  background:linear-gradient(180deg,var(--bg-elevated),var(--bg-panel-2));
  border-bottom:1px solid var(--border);
  z-index:20;
}
#topbar .brand{
  display:flex;
  align-items:center;
  gap:9px;
  white-space:nowrap;
}
#topbar .brand .dot{
  width:11px;height:11px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
  flex:none;
}
#topbar h1{
  font-size:14.5px;
  font-weight:650;
  margin:0;
  letter-spacing:.1px;
  white-space:nowrap;
  color:#f5e7b3;
}
#topbar .stats{
  font-size:12px;
  color:var(--text-dim);
  white-space:nowrap;
  padding-left:14px;
  border-left:1px solid var(--border);
}
#topbar .spacer{flex:1;}
.toolbar{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.tbtn{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  color:var(--text-dim);
  font-family:var(--font);
  font-size:12px;
  padding:7px 11px;
  border-radius:7px;
  cursor:pointer;
  transition:.12s ease;
  white-space:nowrap;
}
.tbtn:hover{color:var(--text);border-color:#5c5534;background:var(--bg-elevated);}
.tbtn.active{color:#1a1810;background:var(--accent);border-color:var(--accent);font-weight:600;}
.tbtn svg{width:14px;height:14px;flex:none;}

/* ---------- Body layout ---------- */
#body{
  flex:1;
  display:flex;
  min-height:0;
  position:relative;
}

/* ---------- Sidebar ---------- */
#sidebar{
  width:288px;
  min-width:288px;
  background:var(--bg-panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  z-index:15;
  transition:margin-left .18s ease;
}
#sidebar.collapsed{margin-left:-289px;}
.side-section{
  border-bottom:1px solid var(--border-soft);
  padding:14px 16px;
}
.side-section.grow{
  flex:1;
  overflow-y:auto;
  min-height:0;
}
.side-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--text-faint);
  font-weight:700;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.side-label .mini-link{
  text-transform:none;
  letter-spacing:0;
  font-weight:500;
  cursor:pointer;
  color:var(--text-faint);
}
.side-label .mini-link:hover{color:var(--accent);}

#search-wrap{position:relative;}
#search{
  width:100%;
  background:var(--bg-panel-2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--font);
  font-size:13px;
  padding:8px 10px 8px 30px;
  border-radius:7px;
  outline:none;
}
#search:focus{border-color:var(--accent);}
#search-wrap svg{
  position:absolute;left:9px;top:9px;width:14px;height:14px;color:var(--text-faint);
  pointer-events:none;
}
#search-results{
  margin-top:8px;
  max-height:260px;
  overflow-y:auto;
  border-radius:7px;
  display:none;
}
#search-results.show{display:block;}
.search-hit{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 8px;
  border-radius:6px;
  cursor:pointer;
  font-size:12.5px;
  color:var(--text);
}
.search-hit:hover{background:var(--bg-elevated);}
.search-hit .swatch{width:9px;height:9px;border-radius:50%;flex:none;}
.search-hit .cap{
  color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.search-hit .lbl{color:var(--text-faint);font-size:10.5px;flex:none;}
.search-empty{color:var(--text-faint);font-size:12px;padding:6px 4px;}

.legend-list{display:flex;flex-direction:column;gap:2px;}
.legend-row{
  display:flex;
  align-items:center;
  gap:9px;
  padding:5px 6px;
  border-radius:6px;
  cursor:pointer;
  font-size:12.5px;
  user-select:none;
  color:var(--text);
}
.legend-row:hover{background:var(--bg-panel-2);}
.legend-row.off{opacity:.38;}
.legend-row .swatch{
  width:12px;height:12px;border-radius:50%;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
}
.legend-row .swatch.rel{border-radius:2px;height:3px;width:16px;}
.legend-row .name{
  flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text);
}
.legend-row .cnt{
  color:var(--text-faint);
  font-size:11px;
  font-variant-numeric:tabular-nums;
}
.toggle-mini{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--text-dim);
  cursor:pointer;margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--border-soft);
}
.switch{
  width:30px;height:17px;border-radius:20px;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  position:relative;flex:none;
  transition:.15s;
}
.switch::after{
  content:"";
  position:absolute;top:1px;left:1px;
  width:13px;height:13px;border-radius:50%;
  background:var(--text-faint);
  transition:.15s;
}
.switch.on{background:var(--accent-dim);border-color:var(--accent);}
.switch.on::after{left:14px;background:var(--accent);}

/* ---------- Canvas ---------- */
#canvas-wrap{
  flex:1;
  position:relative;
  min-width:0;
  background: radial-gradient(circle at 22% 18%, #1a1810 0%, var(--bg-canvas) 55%);
}
#graph-svg{width:100%;height:100%;display:block;cursor:grab;}
#graph-svg.dragging{cursor:grabbing;}

.node-label{
  font-family:var(--font);
  fill:#f0ecd8;
  paint-order:stroke fill;
  stroke:#0e0d0a;
  stroke-width:3px;
  stroke-linejoin:round;
  pointer-events:none;
  font-weight:500;
}
.node-circle{cursor:pointer;}
.node-circle.dim, .node-label.dim{opacity:.1;}
.node-circle.selected{stroke:#ffffff;stroke-width:2.5px;}
.node-circle.hoverable:hover{filter:brightness(1.25);}
.link.dim{opacity:.05;}
.link-hit{cursor:pointer;}

#zoom-controls{
  position:absolute;
  right:16px;
  bottom:16px;
  display:flex;
  flex-direction:column;
  gap:6px;
  z-index:10;
}
.zbtn{
  width:32px;height:32px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  color:var(--text-dim);
  border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:15px;
  user-select:none;
}
.zbtn:hover{color:var(--text);background:var(--bg-elevated);}

#hover-tip{
  position:absolute;
  pointer-events:none;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:7px;
  padding:8px 10px;
  font-size:12px;
  max-width:280px;
  z-index:30;
  display:none;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
#hover-tip .t-label{
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-faint);margin-bottom:3px;font-weight:700;
}
#hover-tip .t-cap{color:var(--text);line-height:1.4;}

#legend-empty-hint{
  font-size:11.5px;color:var(--text-faint);
  padding:6px 6px 0;
}

/* ---------- Detail panel ---------- */
#detail{
  position:absolute;
  top:0;right:0;bottom:0;
  width:378px;
  background:var(--bg-panel);
  border-left:1px solid var(--border);
  transform:translateX(100%);
  transition:transform .2s ease;
  z-index:25;
  display:flex;
  flex-direction:column;
  box-shadow:-18px 0 40px rgba(0,0,0,.35);
}
#detail.open{transform:translateX(0);}
#detail-head{
  padding:16px 16px 14px;
  border-bottom:1px solid var(--border-soft);
  display:flex;
  gap:12px;
  align-items:flex-start;
}
#detail-head .swatch-lg{
  width:14px;height:14px;border-radius:50%;
  margin-top:4px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);
}
#detail-head .titles{flex:1;min-width:0;}
#detail-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-faint);font-weight:700;margin-bottom:4px;
}
#detail-caption{
  font-size:14px;line-height:1.45;color:var(--text);
  word-wrap:break-word;
}
#detail-close{
  background:none;border:none;color:var(--text-faint);
  cursor:pointer;font-size:18px;line-height:1;padding:2px;flex:none;
}
#detail-close:hover{color:var(--text);}
#detail-body{
  flex:1;overflow-y:auto;
  padding:14px 16px 24px;
}
.prop-row{margin-bottom:14px;}
.prop-key{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-faint);font-weight:700;margin-bottom:4px;
}
.prop-val{
  font-size:12.8px;line-height:1.55;color:#f0ecd8;
  white-space:pre-wrap;word-wrap:break-word;
}
.conn-head{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-faint);font-weight:700;
  margin:18px 0 8px;
  padding-top:14px;
  border-top:1px solid var(--border-soft);
}
.conn-group{margin-bottom:10px;}
.conn-type{
  font-size:11px;color:var(--accent);font-weight:600;margin-bottom:5px;
}
.conn-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;
  border-radius:6px;
  cursor:pointer;
  font-size:12.3px;
  color:var(--text);
}
.conn-item:hover{background:var(--bg-elevated);}
.conn-item .swatch{width:8px;height:8px;border-radius:50%;flex:none;}
.conn-item .cap{
  flex:1;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.conn-item .arrow{color:var(--text-faint);font-size:10px;flex:none;}

/* scrollbars */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#3d3a28;border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:#5c5534;}

#loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;
  color:var(--text-dim);font-size:13px;
  background:var(--bg-canvas);
  z-index:50;
}
.spinner{
  width:26px;height:26px;border-radius:50%;
  border:2.5px solid var(--border);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Responsive ---------- */
@media (max-width:820px){
  #sidebar{position:absolute;top:0;bottom:0;left:0;height:100%;}
  #detail{width:88vw;}
  #topbar h1{display:none;}
  #topbar .stats{display:none;}
}
@media (max-width:600px){
  #topbar{gap:10px;padding:0 10px;}
  .toolbar{gap:4px;}
  .tbtn{font-size:0;padding:7px 8px;gap:0;}
  .tbtn svg{width:16px;height:16px;}
  #btn-sidebar svg,
  #btn-labels svg,
  #btn-fit svg,
  #btn-reset svg,
  #btn-png svg{margin:0;}
  #topbar .brand .dot{width:9px;height:9px;}
  #sidebar{width:260px;min-width:260px;}
  #sidebar.collapsed{margin-left:-261px;}
}
</style>
</head>

        Export PNG
      </button>
    </div>
  </div>

  <div id="body">
    <div id="sidebar">
      <div class="side-section">
        <div class="side-label">Search</div>
        <div id="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" type="text" placeholder="Search nodes & properties…" autocomplete="off">
          <div id="search-results"></div>
        </div>
      </div>

      <div class="side-section grow">
        <div class="side-label">
          <span>Node labels</span>
          <span>
            <span class="mini-link" id="legend-all-nodes">all</span> /
            <span class="mini-link" id="legend-none-nodes">none</span>
          </span>
        </div>
        <div class="legend-list" id="node-legend"></div>

        <div class="side-label" style="margin-top:20px;">Relationship types</div>
        <div class="legend-list" id="rel-legend"></div>

        <div class="toggle-mini" id="colorize-toggle-row">
          <div class="switch on" id="colorize-switch"></div>
          <span>Colorize relationships by type</span>
        </div>
      </div>
    </div>

    <div id="canvas-wrap">
      <svg id="graph-svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="context-stroke" fill-opacity="0.85"></path>
          </marker>
        </defs>
      </svg>

      <div id="zoom-controls">
        <div class="zbtn" id="zoom-in" title="Zoom in">+</div>
        <div class="zbtn" id="zoom-out" title="Zoom out">−</div>
        <div class="zbtn" id="zoom-reset" title="Fit to screen">⌘</div>
      </div>

      <div id="hover-tip">
        <div class="t-label"></div>
        <div class="t-cap"></div>
      </div>

      <div id="loading">
        <div class="spinner"></div>
        <div>Laying out graph…</div>
      </div>
    </div>

    <div id="detail">
      <div id="detail-head">
        <div class="swatch-lg" id="detail-swatch"></div>
        <div class="titles">
          <div id="detail-label">Label</div>
          <div id="detail-caption">Caption</div>
        </div>
        <button id="detail-close">&times;</button>
      </div>
      <div id="detail-body"></div>
    </div>
  </div>

": 4, "props": {"Action": "Action 5", "Some commonality": "3", "Little or no commonality": "2", "Total": "6", "Subject of the Code of Conduct Action": "Risk management framework", "High or complete commonality": "1"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:6", "label": "Subject of the Code of Conduct Action", "caption": "Action 6", "color": "#ffc89c", "size": 4, "props": {"Action": "Action 6", "Some commonality": "4", "Total": "10", "Subject of the Code of Conduct Action": "Cybersecurity", "High or complete commonality": "6"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:7", "label": "Subject of the Code of Conduct Action", "caption": "Action 7", "color": "#ffc89c", "size": 4, "props": {"Action": "Action 7", "Some commonality": "1", "Little or no commonality": "1", "Total": "5", "Subject of the Code of Conduct Action": "Content Authentication and Provenance Mechanisms", "High or complete commonality": "3"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:8", "label": "Subject of the Code of Conduct Action", "caption": "Action 8", "color": "#ffc89c", "size": 4, "props": {"Action": "Action 8", "Some commonality": "3", "Total": "3", "Subject of the Code of Conduct Action": "Investments in Research and Mitigation Measures"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:9", "label": "Subject of the Code of Conduct Action", "caption": "Action 9", "color": "#ffc89c", "size": 4, "props": {"Action": "Action 9", "Some commonality": "3", "Little or no commonality": "1", "Total": "5", "Subject of the Code of Conduct Action": "Developing AI for the Benefit of the Public", "High or complete commonality": "1"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:10", "label": "Subject of the Code of Conduct Action", "caption": "Action 10", "color": "#ffc89c", "size": 4, "props": {"Action": "Action 10", "Total": "2", "Subject of the Code of Conduct Action": "Development and Adoption of Technical Standards", "High or complete commonality": "2"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:11", "label": "Subject of the Code of Conduct Action", "caption": "Action 11", "color": "#ffc89c", "size": 4, "props": {"Action": "Action 11", "Some commonality": "2", "Little or no commonality": "1", "Total": "4", "Subject of the Code of Conduct Action": "Data input measures and protections for personal data and intellectual property", "High or complete commonality": "1"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:12", "label": "findings", "caption": "Action 0", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 0", "Findings": "● The Act is much more clear about the AI models and systems the CoC and Act apply to, about the values concerned,  and how providers may comply with the Act through different conformity mechanisms.", "Subject of Code of Conduct Action": "Intro: General and Introduction"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:13", "label": "findings", "caption": "Action 1", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 1", "Findings": "● Both the CoC and AIA are broadly similar regarding the need for a risk management process, model evaluations and  documentation in order to mitigate risks throughout the AI lifecycle.  ● There are important differences, such as the AIA consideration of concepts such as the “state of the art”, and risks along  the AI value chain, while the CoC has a unique focus on collaboration and research.  ● They are not exactly the same in some details, but are mostly common or at least compatible.", "Subject of Code of Conduct Action": "1. Risk management and  evaluations"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:14", "label": "findings", "caption": "Action 2", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 2", "Findings": "● Action 2 focuses on the monitoring of vulnerabilities and incidents and on concrete measures to do so.  ● Action 2 is relatively explicit, while the AI Act is less so. That said, most of these explicit points can reasonably be  inferred from the Act. At the same time, while the CoC is relatively specific, the Act is more broad. Thus, the points in  Action 2, in conjunction with other measures, can be seen as specific measures to fulfil the broader requirements of the  Act.  ● There is low commonality regarding the facilitation and incentivisation of finding issues and vulnerabilities, in particular  through contests or prizes, though bug bounties may be appropriate.  ● The least commonality is found where Action 2 states that orgs should use AI systems as intended.", "Subject of Code of Conduct Action": "2.  Identify and mitigate  vulnerabilities"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:15", "label": "findings", "caption": "Action 3", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 3", "Findings": "● Action 3 requires public reporting while the AI Act Art. 53 (and Annexes XI and XII that specify the content of the  reports) require three kinds of reports that are targeted to different audiences: one that can be requested by the AI  Office and by national authorities, one that should be provided to downstream providers and one public report about the  content used for training.  ● According to the CoC, reports should be kept up to date, and published for all significant releases, while according to  the AIA, they should only be kept up-to-date.  ● The CoC report and the AIA reports share one topic with high commonality: a technical documentation of the model  ● The CoC report and the AIA reports share some contents with medium commonality: detail on evaluations red-teaming,                                                                                                  discussion and assessment of risks to safety or society, instructions of use (only the CoC report and the AIA report to  downstream providers share that) and model capacities  ● There is no topic from the CoC report that is completely ignored in the AI Act reports.", "Subject of Code of Conduct Action": "3. Transparency and  documentation"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:16", "label": "findings", "caption": "Action 4", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 4", "Findings": "● Action 4 requires public reporting while the AI Act Art. 53 (and Annexes XI and XII that specify the content of the  reports) require three kinds of report that are targeted to different audiences: one that can be requested by the AI Office  and by national authorities, one that should be provided to downstream providers and one public report about the  content used for training  ●  Incident reports are required by both CoC and AIA with high commonality.  ● The CoC report and the AIA reports share some contents with medium commonality: evaluation reports, information on  security and safety risks and information on dangerous intended or unintended capabilities  ● The CoC report contains contents that do not have to be included in the AIA reports: Information on attempts by AI  actors to circumvent safeguards", "Subject of Code of Conduct Action": "4.  Incident reporting and  information sharing"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:17", "label": "findings", "caption": "Action 5", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 5", "Findings": "● Action 5 is explicit about providers having “AI governance and risk management policies”. However, the AI Act does not  have a binding requirement for such policies. That said, 55(1)(b)’s requirement to “assess and mitigate possible  systemic risks” is complemented by Recital 114 stating that providers, “should continuously assess and mitigate  systemic risks, including for example by putting in place risk-management policies, such as accountability and  governance processes.”  ● While most of the detailed points in Action 5 are not in the AI Act, they are best practices in risk management and  should be followed.", "Subject of Code of Conduct Action": "5. Risk management framework"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:18", "label": "findings", "caption": "Action 6", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 6", "Findings": "● Overall, Action 6 and the Act have much in common. The overall concerns are the same, and some of the text is exactly  the same. Where one of the two is more specific, these more detailed requirements can be reasonably inferred from the  other text.", "Subject of Code of Conduct Action": "6. Cybersecurity"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:19", "label": "findings", "caption": "Action 7", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 7", "Findings": "● Both CoC and AIA require content authentication and provenance mechanisms.  ● CoC prescribes tools or APIs to allow users to determine if particular content was created with their advanced AI  system, such as via watermarks; AIA includes watermarks as a possible technique, but additionally mentions metadata  identifications and cryptographic methods  ● CoC prescribes collaboration and investments in research, as appropriate, to advance the state of the field of content  authentication and provenance mechanisms; the AIA does not contain the obligation for providers to advance the field, it  just prescribes the application of such mechanisms", "Subject of Code of Conduct Action": "7. Content authentication and  provenance mechanisms"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:20", "label": "findings", "caption": "Action 8", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 8", "Findings": "● Commonality: The objectives of the research investments prescribed by the CoC are in line with the objectives of the AIA.  ● Discrepancy: The CoC requires research investments and collaboration to promote those objectives. The AIA does not  require such research investments and collaboration and does not require providers to share research and best  practices on risk mitigation. However, there are some ways for GPAI model providers to share their research with  institutions, namely through the advisory forum and the drawing-up of the codes of practice.", "Subject of Code of Conduct Action": "8.  Investments in research and mitigation measures"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:21", "label": "findings", "caption": "Action 9", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 9", "Findings": "● CoC and AIA have similar (or at least compatible) end-goals regarding developing AI for the benefit of the public, but the  details of their scope and who is responsible differ", "Subject of Code of Conduct Action": "9. Developing AI for the benefit of  the public"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:22", "label": "findings", "caption": "Action 10", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 10", "Findings": "● Both the CoC and the Act encourage organisations to participate in the development and use of content provenance  methods, along with other methodologies and measures more broadly.", "Subject of Code of Conduct Action": "10. Development and adoption of  technical standards"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:23", "label": "findings", "caption": "Action 11", "color": "#b1aadb", "size": 2.0736, "props": {"Action": "Action 11", "Findings": "● The CoC prescribes measures to manage data quality in order to mitigate against harmful biases; in the AIA, such  measures are implied to be part of the mitigation of systemic risks and their sources.  ● With respect to privacy, personal data, copyright, and intellectual property, the AIA (especially when combined with  Union law) is much more detailed, explicit and comprehensive in its requirements.  ● Both require assurance of privacy and compliance with other legal frameworks; the AIA explicitly mentions the need to  comply with Directive (EU) 2019/790.", "Subject of Code of Conduct Action": "11. Data input measures and  protections for personal data  and intellectual property"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:27", "label": "Action 0", "caption": "Values", "color": "#959AA1", "size": 2.8223999999999996, "props": {"number": "1", "Hiroshima Process Code of Conduct (Introduction/Preamble)": "Intro: “the [HAIP CoC] for  Organizations Developing Advanced  AI Systems aims to promote safe,  secure, and trustworthy AI  worldwide”   I ntro: “While harnessing the  opportunities of innovation,  organizations should respect the  rule of law, human rights, due  process, diversity, fairness and  non-discrimination, democracy, and  human- centricity, in the design,  development and deployment of  advanced AI systems.”   I ntro: [international human rights  law] “ seek to ensure the trustworthiness,  safety and security of systems  throughout their entire lifecycle”", "Comments": "AIA is more stringent.   G enerally compatible, but not all  fundamental rights enshrined in  the Charter are covered by  international human rights law  (at least to our knowledge)", "EU AI Act (GPAI focus)": "1(1): “The purpose of this Regulation is  to…promote the uptake of…trustworthy  [AI], while ensuring a high level of  protection of health, safety,  fundamental rights enshrined in the  Charter, including democracy, the rule  of law and environmental protection,  against the harmful effects of AI  systems in the Union”", "Point of Comparison": "Values"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:28", "label": "Action 0", "caption": "Conformity mechanisms", "color": "#959AA1", "size": 2.8223999999999996, "props": {"number": "2", "Hiroshima Process Code of Conduct (Introduction/Preamble)": "“Different jurisdictions may take their  own unique approaches to  implementing these actions in  different ways.”   O ECD Informal Task Force  Reporting Framework", "Comments": "AIA is more specific.   A s a conformity mechanism for  the AIA, the Codes of Practice  (and standards) have specific  expectations set out in the legal  text.  The CoC does not have such  expectations.", "EU AI Act (GPAI focus)": "40: Harmonised standards   4 1: Common specifications   5 6: Codes of practice", "Point of Comparison": "Conformity mechanisms"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:29", "label": "Action 0", "caption": "Definition of advanced AI /  general-purpose AI", "color": "#959AA1", "size": 2.8223999999999996, "props": {"number": "3", "Hiroshima Process Code of Conduct (Introduction/Preamble)": "“the most advanced AI systems,  including the most advanced  foundation models and generative  AI systems (henceforth 'advanced  AI systems').”", "Comments": "The CoC doesn’t clearly define  the category “most advanced AI  systems”, while the Act has an  explicit focus on defining  “general-purpose AI models”  and “general-purpose AI models  with systemic risk” with multiple  definitions, articles, recitals, and  an annex.", "EU AI Act (GPAI focus)": "3(63): [definition of] ‘general-purpose  AI model’   3 (64): [definition of] ‘high-impact  capabilities’   3 (65): [definition of] ‘systemic risk’   5 1: “Classification of general-purpose  AI models as general-purpose AI  models with systemic risk”   5 2: “Procedure [for the classification of  general-purpose AI models as  general-purpose AI models with  systemic risk]”   ( 112): “It is also necessary to clarify a  procedure for the classification of a                                                                   general-purpose AI model with  systemic risks.”   ( 113): “If the Commission becomes  aware of the fact that a  general-purpose AI model meets the  requirements to classify as a  general-purpose AI model with  systemic risk…”   A nnex XIII: “Criteria for the designation  of general-purpose AI models with  systemic risk referred to in Article 51”", "Point of Comparison": "Definition of advanced AI /  general-purpose AI"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:30", "label": "Action 1", "caption": "56(2): The AI Office and the Board shall  aim to ensure that the codes of practice  cover at least the obligations provided  for in Articles 53 and 55, including the  following issues:  (d): “the measures, procedures and  modalities for the assessment and  management of the systemic risks at  Union level, including the  documentation thereof, which shall be  proportionate to the risks, take into  consideration their severity and  probability and take into account the  specific challenges of tackling those  risks in light of the possible ways in  which such risks may emerge and  materialise along the AI value chain.”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "1", "Comments": "Need to consider difference in  meaning between CoC use of  'appropriate' and  'unreasonable' vs AIA use of  'proportionate'", "EU AI Act (GPAI focus)": "56(2): The AI Office and the Board shall  aim to ensure that the codes of practice  cover at least the obligations provided  for in Articles 53 and 55, including the  following issues:  (d): “the measures, procedures and  modalities for the assessment and  management of the systemic risks at  Union level, including the  documentation thereof, which shall be  proportionate to the risks, take into  consideration their severity and  probability and take into account the  specific challenges of tackling those  risks in light of the possible ways in  which such risks may emerge and  materialise along the AI value chain.”", "Point of Comparison": "Level of effort, level of  mitigation", "Hiroshima Process Code of Conduct (Action 1)": "Intro: “Organizations should follow  these actions in line with a  risk-based approach.”   “ Take appropriate measures”   “ implementing appropriate  mitigation to address identified risks  and vulnerabilities.”   “ seek to ensure the trustworthiness,  safety and security of systems  throughout their entire lifecycle so  that they do not pose unreasonable  risks.”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:31", "label": "Action 1", "caption": "55(1)(b): “assess and mitigate possible  systemic risks at Union level, including their sources, that may stem from the  development, the placing on the  market, or the use of general-purpose  AI models with systemic risk;”   ( 114): “perform the necessary model  evaluations in particular prior to its  first placing on the market”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "2", "Comments": "Both cover the entire life cycle  (development, placing on market, use)", "EU AI Act (GPAI focus)": "55(1)(b): “assess and mitigate possible  systemic risks at Union level, including their sources, that may stem from the  development, the placing on the  market, or the use of general-purpose  AI models with systemic risk;”   ( 114): “perform the necessary model  evaluations in particular prior to its  first placing on the market”", "Point of Comparison": "Life cycle", "Hiroshima Process Code of Conduct (Action 1)": "“Take appropriate measures  throughout the development ofadvanced AI systems, including  prior to and throughout their  deployment and placement on the  market, to identify, evaluate, and  mitigate risks across the AI  lifecycle”   “ Testing and mitigation measures,  should, for example, seek to ensure  the trustworthiness, safety and  security of systems throughout their  entire lifecycle so that they do not  pose unreasonable risks.”   “ [Testing should] be performed at  several checkpoints throughout the  AI lifecycle in particular before  deployment and placement on the  market”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:32", "label": "Action 1", "caption": "55(1)(b): “assess and mitigate possible  systemic risks at Union level, including  their sources, that may stem from the  development, the placing on the  market, or the use of general-purpose  AI models with systemic risk;”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "3", "Comments": "Same, assuming that “assess”  consists of “identify and  evaluate”, which it typically  does in ISO risk management  standards.", "EU AI Act (GPAI focus)": "55(1)(b): “assess and mitigate possible  systemic risks at Union level, including  their sources, that may stem from the  development, the placing on the  market, or the use of general-purpose  AI models with systemic risk;”", "Point of Comparison": "Risk management  process", "Hiroshima Process Code of Conduct (Action 1)": "“Identify, evaluate, and mitigate  risks”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:33", "label": "Action 1", "caption": "Annex XI(Sec 2)(1): “A detailed  description of the evaluation  strategies, including evaluation results,  on the basis of available public  evaluation protocols and tools or  otherwise of other evaluation  methodologies. Evaluation strategies shall include evaluation criteria, metrics  and the methodology on the  identification of limitations.”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "4", "Comments": "Broadly similar", "EU AI Act (GPAI focus)": "Annex XI(Sec 2)(1): “A detailed  description of the evaluation  strategies, including evaluation results,  on the basis of available public  evaluation protocols and tools or  otherwise of other evaluation  methodologies. Evaluation strategies shall include evaluation criteria, metrics  and the methodology on the  identification of limitations.”", "Point of Comparison": "Evaluation methodologies", "Hiroshima Process Code of Conduct (Action 1)": "“combination of methods for  evaluations”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:34", "label": "Action 1", "caption": "(114): “Internal or independent external  testing”   9 2(1): “The AI Office, after consulting  the Board, may conduct evaluations  of the general-purpose AI model  concerned: [...]  (b): to investigate systemic risks at  Union level of general-purpose AI  models with systemic risk, in particular  following a qualified alert from the  scientific panel in accordance with  Article 90(1), point (a).”   9 2(2): “The Commission may decide  to appoint independent experts to  carry out evaluations on its behalf,  including from the scientific panel  established pursuant to Article 68.  Independent experts appointed for this  task shall meet the criteria outlined in  Article 68(2).”   A nnex XI(Sec 2)(2): “Where applicable,  a detailed description of the measures  put in place for the purpose of  conducting internal and/or external  adversarial testing (e.g. red teaming),  model adaptations, including alignment  and fine-tuning.”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "5", "Comments": "CoC uses “and” and uses the  term “diverse”, while AIA uses  “or”.   A IA empowers AIO to conduct  evaluations, and to appoint  independent experts to do so  on its behalf.", "EU AI Act (GPAI focus)": "(114): “Internal or independent external  testing”   9 2(1): “The AI Office, after consulting  the Board, may conduct evaluations  of the general-purpose AI model  concerned: [...]  (b): to investigate systemic risks at  Union level of general-purpose AI  models with systemic risk, in particular  following a qualified alert from the  scientific panel in accordance with  Article 90(1), point (a).”   9 2(2): “The Commission may decide  to appoint independent experts to  carry out evaluations on its behalf,  including from the scientific panel  established pursuant to Article 68.  Independent experts appointed for this  task shall meet the criteria outlined in  Article 68(2).”   A nnex XI(Sec 2)(2): “Where applicable,  a detailed description of the measures  put in place for the purpose of  conducting internal and/or external  adversarial testing (e.g. red teaming),  model adaptations, including alignment  and fine-tuning.”", "Point of Comparison": "Internal vs external  testing", "Hiroshima Process Code of Conduct (Action 1)": "“Diverse internal and independent  external testing”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:35", "label": "Action 1", "caption": "55(1)(a): “perform model evaluation in  accordance with standardised protocols  and tools reflecting the state of the art,  including conducting and documenting  adversarial testing of the model with  a view to identifying and mitigating  systemic risks;”   A nnex XI(Sec 2)(2): “Where applicable,  a detailed description of the measures  put in place for the purpose of  conducting internal and/or external  adversarial testing (e.g. red  teaming), model adaptations, including  alignment and fine-tuning.”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "6", "Comments": "Red-teaming is an example of  testing in both the CoC and  AIA.", "EU AI Act (GPAI focus)": "55(1)(a): “perform model evaluation in  accordance with standardised protocols  and tools reflecting the state of the art,  including conducting and documenting  adversarial testing of the model with  a view to identifying and mitigating  systemic risks;”   A nnex XI(Sec 2)(2): “Where applicable,  a detailed description of the measures  put in place for the purpose of  conducting internal and/or external  adversarial testing (e.g. red  teaming), model adaptations, including  alignment and fine-tuning.”", "Point of Comparison": "Red-teaming", "Hiroshima Process Code of Conduct (Action 1)": "“This includes employing diverse  internal and independent external  testing measures, through a  combination of methods for  evaluations, such as red-teaming”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:36", "label": "Main", "caption": "Main Node", "color": "#4808f8", "size": 4, "props": {"name": "Main Node"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:37", "label": "Action 1", "caption": "55(1)(a): “perform model evaluation in  accordance with standardised  protocols and tools reflecting the  state of the art, including conducting  and documenting adversarial testing of  the model with a view to identifying and  mitigating systemic risks;”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "7", "Comments": "“State of the art” not mentioned  in the CoC.", "EU AI Act (GPAI focus)": "55(1)(a): “perform model evaluation in  accordance with standardised  protocols and tools reflecting the  state of the art, including conducting  and documenting adversarial testing of  the model with a view to identifying and  mitigating systemic risks;”", "Point of Comparison": "State of the art", "Hiroshima Process Code of Conduct (Action 1)": "“Take appropriate measures  throughout the development of  advanced AI systems, including  prior to and throughout their  deployment and placement on the  market, to identify, evaluate, and  mitigate risks across the AI  lifecycle.”   “ This includes employing diverse  internal and independent external  testing measures”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:38", "label": "Action 1", "caption": "XI(Sec 1)(2): “A detailed description of  the elements of the model referred to in  point 1, and relevant information of the  process for the development, including  the following elements: (a) the technical means (e.g.  instructions of use, infrastructure, tools)  required for the general-purpose AI  model to be integrated in AI systems;  (b) the design specifications of the  model and training process, including  training methodologies and techniques,  the key design choices including the  rationale and assumptions made;  what the model is designed to optimise  for and the relevance of the different  parameters, as applicable;  (c) information on the data used for  training, testing and validation,  where applicable, including the type  and provenance of data and curation  methodologies (e.g. cleaning, filtering,  etc.), the number of data points, their  scope and main characteristics; how  the data was obtained and selected  as well as all other measures to  detect the unsuitability of data  sources and methods to detect  identifiable biases, where applicable;  (d) the computational resources used to  train the model (e.g. number of floating  point operations), training time, and  other relevant details related to the  training;  (e) known or estimated energy  consumption of the model.”   X I(Sec 2)(1): “A detailed description of  the evaluation strategies, including  evaluation results, on the basis of  available public evaluation protocols  and tools or otherwise of other  evaluation methodologies. Evaluation  strategies shall include evaluation  criteria, metrics and the methodology  on the identification of limitations.”   X III: “Criteria for the designation of  general-purpose AI models with  systemic risk referred to in Article 51”  (b): “the quality or size of the data  set, for example measured through  tokens;”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "8", "Comments": "Both require traceability, but the  AIA is more explicit and  detailed.   T he AIA Annexes have explicit traceability requirements  regarding design choices,  processes, and data used.", "EU AI Act (GPAI focus)": "XI(Sec 1)(2): “A detailed description of  the elements of the model referred to in  point 1, and relevant information of the  process for the development, including  the following elements: (a) the technical means (e.g.  instructions of use, infrastructure, tools)  required for the general-purpose AI  model to be integrated in AI systems;  (b) the design specifications of the  model and training process, including  training methodologies and techniques,  the key design choices including the  rationale and assumptions made;  what the model is designed to optimise  for and the relevance of the different  parameters, as applicable;  (c) information on the data used for  training, testing and validation,  where applicable, including the type  and provenance of data and curation  methodologies (e.g. cleaning, filtering,  etc.), the number of data points, their  scope and main characteristics; how  the data was obtained and selected  as well as all other measures to  detect the unsuitability of data  sources and methods to detect  identifiable biases, where applicable;  (d) the computational resources used to  train the model (e.g. number of floating  point operations), training time, and  other relevant details related to the  training;  (e) known or estimated energy  consumption of the model.”   X I(Sec 2)(1): “A detailed description of  the evaluation strategies, including  evaluation results, on the basis of  available public evaluation protocols  and tools or otherwise of other  evaluation methodologies. Evaluation  strategies shall include evaluation  criteria, metrics and the methodology  on the identification of limitations.”   X III: “Criteria for the designation of  general-purpose AI models with  systemic risk referred to in Article 51”  (b): “the quality or size of the data  set, for example measured through  tokens;”", "Point of Comparison": "Traceability", "Hiroshima Process Code of Conduct (Action 1)": "“developers should seek to enable  traceability, in relation to datasets,  processes, and decisions made  during system development.”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:39", "label": "Action 1", "caption": "53(1)(a): “draw up and keep  up-to-date the technical  documentation of the model,  including its training and testing  process and the results of its  evaluation…”   5 3(1)(b): “draw up, keep up-to-date  and make available information and  documentation to providers of AI  systems who intend to integrate the  general-purpose AI model into their AI  systems…”   5 5(1)(a): “...conducting and  documenting adversarial testing of the  model…”   5 5(1)(b): “...assess and mitigate possible systemic risks…”   5 6(2): The AI Office and the Board shall  aim to ensure that the codes of practice  cover at least the obligations provided  for in Articles 53 and 55, including the  following issues:  (d): “the measures…for the assessment  and management of the systemic  risks…including the documentation  thereof, which shall be proportionate to  the risks…”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "9", "Comments": "Both require testing and  mitigation documentation, AIA  is more explicit and detailed.   A rt. 53 requires testing  documentation to be kept up to  date. Mitigation documentation  is not explicitly stated, but is  generally required for risk  management and can be seen  as “proportionate to the risks”  (Art. 56).", "EU AI Act (GPAI focus)": "53(1)(a): “draw up and keep  up-to-date the technical  documentation of the model,  including its training and testing  process and the results of its  evaluation…”   5 3(1)(b): “draw up, keep up-to-date  and make available information and  documentation to providers of AI  systems who intend to integrate the  general-purpose AI model into their AI  systems…”   5 5(1)(a): “...conducting and  documenting adversarial testing of the  model…”   5 5(1)(b): “...assess and mitigate possible systemic risks…”   5 6(2): The AI Office and the Board shall  aim to ensure that the codes of practice  cover at least the obligations provided  for in Articles 53 and 55, including the  following issues:  (d): “the measures…for the assessment  and management of the systemic  risks…including the documentation  thereof, which shall be proportionate to  the risks…”", "Point of Comparison": "Documentation", "Hiroshima Process Code of Conduct (Action 1)": "“[Testing and mitigation] measures  should be documented and  supported by regularly updated  technical documentation”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:40", "label": "Action 1", "caption": "55(1)(a): “perform model evaluation in  accordance with standardised  protocols and tools reflecting the  state of the art, including conducting  and documenting adversarial testing of  the model with a view to identifying and  mitigating systemic risks;”   5 5(1)(d): “ensure an adequate level of  cybersecurity protection for the  general-purpose AI model with  systemic risk and the physical  infrastructure of the model.”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "10", "Comments": "Equivalent, assuming that the  AIA considers the testing  environment to be part of the  physical infrastructure of the  model", "EU AI Act (GPAI focus)": "55(1)(a): “perform model evaluation in  accordance with standardised  protocols and tools reflecting the  state of the art, including conducting  and documenting adversarial testing of  the model with a view to identifying and  mitigating systemic risks;”   5 5(1)(d): “ensure an adequate level of  cybersecurity protection for the  general-purpose AI model with  systemic risk and the physical  infrastructure of the model.”", "Point of Comparison": "Secure environments", "Hiroshima Process Code of Conduct (Action 1)": "“testing should take place in secure  environments”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:41", "label": "Action 1", "caption": "55(1)(a): “perform model evaluation  in accordance with standardised  protocols and tools reflecting the state  of the art, including conducting and  documenting adversarial testing of the  model with a view to identifying and  mitigating systemic risks;”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "11", "Comments": "Equivalent   C oC explicitly adds “whether  accidental or intentional”", "EU AI Act (GPAI focus)": "55(1)(a): “perform model evaluation  in accordance with standardised  protocols and tools reflecting the state  of the art, including conducting and  documenting adversarial testing of the  model with a view to identifying and  mitigating systemic risks;”", "Point of Comparison": "Testing supports risk  identification and  mitigation", "Hiroshima Process Code of Conduct (Action 1)": "“[Testing should take place] to  identify risks and vulnerabilities,  and to inform action to address the  identified AI risks to security, safety  and societal and other risks,  whether accidental or intentional”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:42", "label": "Action 1", "caption": "Recital 110: [List of risks, along with  hazards and hazardous situations]   R ecital 116: “codes of practice should  help to establish a risk taxonomy of the  type and nature of the systemic  risks…including their sources”   3 (65): “‘systemic risk’ means a risk that  is specific to the high-impact  capabilities of general-purpose AI  models, having a significant impact on  the Union market due to their reach, or  due to actual or reasonably foreseeable  negative effects on public health,  safety, public security, fundamental  rights, or the society as a whole, that  can be propagated at scale across the  value chain;”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "12", "Comments": "All risks in Action 1 are in  Recital 110. However, Recital  110 lists more risks, as well as  their nature, contributing  factors, ,   “ Useful defensive [cyber]  applications” is noted in the  CoC but not in the AIA. Same  for “non-state actors” under  CBRNE risks.   C oC does not require further  risk taxonomy.", "EU AI Act (GPAI focus)": "Recital 110: [List of risks, along with  hazards and hazardous situations]   R ecital 116: “codes of practice should  help to establish a risk taxonomy of the  type and nature of the systemic  risks…including their sources”   3 (65): “‘systemic risk’ means a risk that  is specific to the high-impact  capabilities of general-purpose AI  models, having a significant impact on  the Union market due to their reach, or  due to actual or reasonably foreseeable  negative effects on public health,  safety, public security, fundamental  rights, or the society as a whole, that  can be propagated at scale across the  value chain;”", "Point of Comparison": "Risk taxonomy", "Hiroshima Process Code of Conduct (Action 1)": "Seven top-level risks listed in Action  1"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:43", "label": "Action 1", "caption": "53(3): “Providers of general-purpose AI  models shall cooperate as necessary  with the Commission and the national  competent authorities in the exercise of  their competences and powers  pursuant to this Regulation”   9 2(1): “The AI Office, after consulting  the Board, may conduct evaluations of  the general-purpose AI model  concerned:”   9 2(2): “The Commission may decide to  appoint independent experts to carry out evaluations on its behalf, including  from the scientific panel established  pursuant to Article 68. Independent  experts appointed for this task shall  meet the criteria outlined in Article  68(2).”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "13", "Comments": "AIA does not require  collaboration with “relevant  actors across sectors”, except  perhaps for when the AIO  exercises its power to conduct  evaluations and delegates this  to a third party.", "EU AI Act (GPAI focus)": "53(3): “Providers of general-purpose AI  models shall cooperate as necessary  with the Commission and the national  competent authorities in the exercise of  their competences and powers  pursuant to this Regulation”   9 2(1): “The AI Office, after consulting  the Board, may conduct evaluations of  the general-purpose AI model  concerned:”   9 2(2): “The Commission may decide to  appoint independent experts to carry out evaluations on its behalf, including  from the scientific panel established  pursuant to Article 68. Independent  experts appointed for this task shall  meet the criteria outlined in Article  68(2).”", "Point of Comparison": "Collaboration", "Hiroshima Process Code of Conduct (Action 1)": "“Organizations commit to work in  collaboration with relevant actors  across sectors, to assess and adopt  mitigation measures to address  these risks, in particular systemic  risks.”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:44", "label": "Action 1", "caption": "Not found", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "14", "Comments": "AIA does not require  organisations to advance  research and investment", "EU AI Act (GPAI focus)": "Not found", "Point of Comparison": "Research", "Hiroshima Process Code of Conduct (Action 1)": "“Organizations making these  commitments should also endeavor  to advance research and  investment on the security, safety,  bias and disinformation, fairness,  explainability and interpretability,  and transparency of advanced AI  systems and on increasing  robustness and trustworthiness of  advanced AI systems against  misuse.”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:45", "label": "Action 1", "caption": "56(2): The AI Office and the Board shall  aim to ensure that the codes of practice  cover at least the obligations provided  for in Articles 53 and 55, including the  following issues:  (d): “take into account the specific  challenges of tackling those risks in  light of the possible ways in which  such risks may emerge and  materialise along the AI value chain.”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "15", "Comments": "Action 3 includes the  consideration of deployers and  users, but only with respect to  transparency reports.", "EU AI Act (GPAI focus)": "56(2): The AI Office and the Board shall  aim to ensure that the codes of practice  cover at least the obligations provided  for in Articles 53 and 55, including the  following issues:  (d): “take into account the specific  challenges of tackling those risks in  light of the possible ways in which  such risks may emerge and  materialise along the AI value chain.”", "Point of Comparison": "Value chain", "Hiroshima Process Code of Conduct (Action 1)": "Not found"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:46", "label": "Action 1", "caption": "3(2): “‘risk’ means the combination of  the probability of an occurrence of harm  and the severity of that harm;”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "16", "Comments": "CoC appears to only refer to  risks of harm. Also, the term  “mitigatate” is typically used in  risk management when  addressing risk of harm, while the term “treatment” is typically  used when addressing risk that  could result in positive or  negative outcomes. That said,  neither “severity” nor  “probability” appear in the CoC.   T he AIA is quite clear on the  need to address risk of harm  and both its probability and  severity.", "EU AI Act (GPAI focus)": "3(2): “‘risk’ means the combination of  the probability of an occurrence of harm  and the severity of that harm;”", "Point of Comparison": "Definition of risk", "Hiroshima Process Code of Conduct (Action 1)": "Not found"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:47", "label": "Action 1", "caption": "55(1)(b): “assess and mitigate possible  systemic risks at Union level, including  their sources, that may stem from the  development, the placing on the  market, or the use of general-purpose  AI models with systemic risk;”   5 6(2): The AI Office and the Board shall  aim to ensure that the codes of practice  cover at least the obligations provided  for in Articles 53 and 55, including the  following issues:  (c): “the identification of the type and  nature of the systemic risks at Union  level, including their sources, where  appropriate;”", "color": "#710771", "size": 2.8223999999999996, "props": {"number": "17", "Comments": "Neither “risk source(s)” nor  “hazard(s)” appear in the CoC.   H owever, risk source and  hazard identification is typically  necessary for risk management.", "EU AI Act (GPAI focus)": "55(1)(b): “assess and mitigate possible  systemic risks at Union level, including  their sources, that may stem from the  development, the placing on the  market, or the use of general-purpose  AI models with systemic risk;”   5 6(2): The AI Office and the Board shall  aim to ensure that the codes of practice  cover at least the obligations provided  for in Articles 53 and 55, including the  following issues:  (c): “the identification of the type and  nature of the systemic risks at Union  level, including their sources, where  appropriate;”", "Point of Comparison": "Risk sources (hazards)", "Hiroshima Process Code of Conduct (Action 1)": "Not found"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:48", "label": "Action 2", "caption": "53(1)(b): “draw up, keep up-to-date  and make available information and  documentation to providers of AI  systems who intend to integrate the  general-purpose AI model into their  AI systems. Without prejudice to the  need to observe and protect intellectual  property rights and confidential  business information or trade secrets in  accordance with Union and national law,  the information and documentation  shall:  (i) enable providers of AI systems to  have a good understanding of the  capabilities and limitations of the  general-purpose AI model and to  comply with their obligations pursuant to  this Regulation; and (ii) contain, at a minimum, the  elements set out in Annex XII;”   A nnex XII(1)(b): “the acceptable use  policies applicable;”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "CoC only.   I ntended use is only in the  requirements for high-risk AI  systems, not those for GPAI  models. However, GPAI model  providers have transparency  obligations which include  documenting the acceptable use  policies applicable.", "EU AI Act (GPAI focus)": "53(1)(b): “draw up, keep up-to-date  and make available information and  documentation to providers of AI  systems who intend to integrate the  general-purpose AI model into their  AI systems. Without prejudice to the  need to observe and protect intellectual  property rights and confidential  business information or trade secrets in  accordance with Union and national law,  the information and documentation  shall:  (i) enable providers of AI systems to  have a good understanding of the  capabilities and limitations of the  general-purpose AI model and to  comply with their obligations pursuant to  this Regulation; and (ii) contain, at a minimum, the  elements set out in Annex XII;”   A nnex XII(1)(b): “the acceptable use  policies applicable;”", "Point of Comparison": "Intended use/purpose", "#": "1", "Hiroshima Process Code of Conduct (Action 2)": "“Organizations should use…AI  systems as intended”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:49", "label": "Action 2", "caption": "(110): “...In particular, international  approaches have so far identified the  need to pay attention to risks from  potential intentional misuse...'   5 5(1)(b): “assess and mitigate  possible systemic risks at Union  level, including their sources, that  may stem from the development, the  placing on the market, or the use of  general-purpose AI models with  systemic risk;”   5 5(1)(c): “keep track of, document,  and report, without undue delay, to the  AI Office and, as appropriate, to  national competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "Identifying and mitigating  vulnerabilities and misuse is  appropriate, even necessary, to  comprehensively assess possible  risks, keep track of serious  incidents, and ensure an adequate  level of cybersecurity protection.   C oC Action 2 appears to limit  these efforts to the  post-deployment lifecycle stage,  whereas the AIA requires them  across the lifecycle.", "EU AI Act (GPAI focus)": "(110): “...In particular, international  approaches have so far identified the  need to pay attention to risks from  potential intentional misuse...'   5 5(1)(b): “assess and mitigate  possible systemic risks at Union  level, including their sources, that  may stem from the development, the  placing on the market, or the use of  general-purpose AI models with  systemic risk;”   5 5(1)(c): “keep track of, document,  and report, without undue delay, to the  AI Office and, as appropriate, to  national competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”", "Point of Comparison": "Life cycle", "#": "2", "Hiroshima Process Code of Conduct (Action 2)": "“Identify and mitigate  vulnerabilities, and, where  appropriate, incidents and  patterns of misuse, after  deployment including placement  on the market.”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:50", "label": "Action 2", "caption": "(110): “...In particular, international  approaches have so far identified the  need to pay attention to risks from  potential intentional misuse...'   5 5(1)(b): “assess and mitigate  possible systemic risks at Union level,including their sources, that may stem  from the development, the placing on  the market, or the use of  general-purpose AI models with  systemic risk;”   5 5(1)(c): “keep track of, document,  and report, without undue delay, to the  AI Office and, as appropriate, to  national competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "CoC is slightly more explicit.   A ddressing vulnerabilities,  emerging risks, and misuse is an  appropriate risk mitigation  measure.  table_page29_num26 table_page29_num26  100% 10 E1  S erious incidents must be reported  under the Act.      \t S erious incidents must be reported  under the Act. Turn on screen reader support Banner hiddenTo enable screen reader support, press Ctrl+Alt+Z To learn about keyboard shortcuts, press Ctrl+slash", "EU AI Act (GPAI focus)": "(110): “...In particular, international  approaches have so far identified the  need to pay attention to risks from  potential intentional misuse...'   5 5(1)(b): “assess and mitigate  possible systemic risks at Union level,including their sources, that may stem  from the development, the placing on  the market, or the use of  general-purpose AI models with  systemic risk;”   5 5(1)(c): “keep track of, document,  and report, without undue delay, to the  AI Office and, as appropriate, to  national competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”", "Point of Comparison": "Corrective action", "#": "3", "Hiroshima Process Code of Conduct (Action 2)": "“Take appropriate action to  address [vulnerabilities,  incidents, emerging risks and  misuse after deployment]”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:51", "label": "Action 2", "caption": "55(1)(b): “assess and mitigate possible  systemic risks at Union level, including  their sources, that may stem from the  development, the placing on the market,  or the use of general-purpose AI models  with systemic risk;”   5 5(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”   5 5(1)(d): “ensure an adequate level of  cybersecurity protection for the  general-purpose AI model with systemic  risk and the physical infrastructure of  the model.”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "CoC is more explicit.   M onitoring for vulnerabilities is in  high-risk AI system requirements,  but not explicitly for GPAI models.   T hat said, monitoring for  vulnerabilities is appropriate, even  necessary, to comprehensively  assess possible risks, keep track  of serious incidents, and ensure an  adequate level of cybersecurity  protection.", "EU AI Act (GPAI focus)": "55(1)(b): “assess and mitigate possible  systemic risks at Union level, including  their sources, that may stem from the  development, the placing on the market,  or the use of general-purpose AI models  with systemic risk;”   5 5(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”   5 5(1)(d): “ensure an adequate level of  cybersecurity protection for the  general-purpose AI model with systemic  risk and the physical infrastructure of  the model.”", "Point of Comparison": "Vulnerabilities", "#": "4", "Hiroshima Process Code of Conduct (Action 2)": "“[Monitor for] vulnerabilities”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:52", "label": "Action 2", "caption": "55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "Equivalent, with the reasonable  inference that monitoring for  incidents is necessary to keep  track of them.", "EU AI Act (GPAI focus)": "55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”", "Point of Comparison": "Incidents", "#": "5", "Hiroshima Process Code of Conduct (Action 2)": "“[Monitor for] incidents”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:53", "label": "Action 2", "caption": "55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”   5 6(2): The AI Office and the Board shall  aim to ensure that the codes of practice  cover at least the obligations provided  for in Articles 53 and 55, including the  following issues:  (d): “the measures, procedures and  modalities for the assessment …of the  systemic risks shall…take into account  the specific challenges of tackling those  risks in light of the possible ways in  which such risks may emerge and  materialise along the AI value chain.”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "Equivalent, assuming that  assessing emerging risks  stemming from use of a model  includes monitoring for incidents,  which is reasonably inferred from  55(1)(c).", "EU AI Act (GPAI focus)": "55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”   5 6(2): The AI Office and the Board shall  aim to ensure that the codes of practice  cover at least the obligations provided  for in Articles 53 and 55, including the  following issues:  (d): “the measures, procedures and  modalities for the assessment …of the  systemic risks shall…take into account  the specific challenges of tackling those  risks in light of the possible ways in  which such risks may emerge and  materialise along the AI value chain.”", "Point of Comparison": "Emerging risks", "#": "6", "Hiroshima Process Code of Conduct (Action 2)": "“[Monitor for] emerging risks”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:54", "label": "Action 2", "caption": "(110): “...In particular, international  approaches have so far identified the  need to pay attention to risks from  potential intentional misuse...' 55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "Misuse is in a recital. Monitoring  for misuse risks is likely necessary  in order to keep track of serious  incidents.", "EU AI Act (GPAI focus)": "(110): “...In particular, international  approaches have so far identified the  need to pay attention to risks from  potential intentional misuse...' 55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”", "Point of Comparison": "Misuse", "#": "7", "Hiroshima Process Code of Conduct (Action 2)": "“[Monitor for] misuse”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:55", "label": "Action 2", "caption": "55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”   5 5(1)(d): “ensure an adequate level of  cybersecurity protection for the  general-purpose AI model with systemic  risk and the physical infrastructure of  the model.”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "CoC is more explicit.   I n theory, under the Act, it is in the  interests of the providers to find all  issues and vulnerabilities to fulfil  their incident reporting and  cybersecurity requirements. One  way to do so is through facilitation  and incentivisation. However, no  explicit mention of facilitation or  incentivisation was found in the  Act, and contests or prizes could  be seen as outside the intention of  the Act.", "EU AI Act (GPAI focus)": "55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”   5 5(1)(d): “ensure an adequate level of  cybersecurity protection for the  general-purpose AI model with systemic  risk and the physical infrastructure of  the model.”", "Point of Comparison": "Facilitating third-parties", "#": "8", "Hiroshima Process Code of Conduct (Action 2)": "“Facilitating third-party and user  discovery and reporting of  issues and vulnerabilities after  deployment such as through  bounty systems, contests, or  prizes to incentivize the  responsible disclosure of  weaknesses”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:56", "label": "Action 2", "caption": "55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "AIA appears more broad.   C oC may technically be limited to  documenting reported incidents,  not all incidents.", "EU AI Act (GPAI focus)": "55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”", "Point of Comparison": "Documentation", "#": "9", "Hiroshima Process Code of Conduct (Action 2)": "“Maintain appropriate  documentation of reported  incidents”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:57", "label": "Action 2", "caption": "55(1)(b): ”assess and mitigate  possible systemic risks at Union level,  including their sources, that may stem  from the development, the placing on the market, or the use of  general-purpose AI models with  systemic risk;”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "AIA appears more broad.   C oC appears to require  “collaboration”, while it seems the AIA leaves it to the providers.  CoC also uses the term  'vulnerabilities', which could  reasonably be assumed to be risks  (or at least hazards or risk  sources).  CoC may lean towards only  reported incidents here as well,  rather than “possible systemic  risks”, though it is unclear.", "EU AI Act (GPAI focus)": "55(1)(b): ”assess and mitigate  possible systemic risks at Union level,  including their sources, that may stem  from the development, the placing on the market, or the use of  general-purpose AI models with  systemic risk;”", "Point of Comparison": "Mitigation", "#": "10", "Hiroshima Process Code of Conduct (Action 2)": "“Mitigate the identified risks and  vulnerabilities, in collaboration  with other stakeholders”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:58", "label": "Action 2", "caption": "55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”   5 5(1)(d): “ensure an adequate level of  cybersecurity protection for the  general-purpose AI model with systemic  risk and the physical infrastructure of  the model.”", "color": "#F16667", "size": 2.8223999999999996, "props": {"Comments": "CoC is more explicit.   I n theory, under the Act, it is in the  interests of the providers to find all  issues and vulnerabilities to fulfil  their incident reporting and  cybersecurity requirements.  However, no explicit mention of  such a reporting mechanism for  stakeholders was found in the Act.", "EU AI Act (GPAI focus)": "55(1)(c): “keep track of, document, and  report, without undue delay, to the AI  Office and, as appropriate, to national  competent authorities, relevant  information about serious incidents  and possible corrective measures to  address them;”   5 5(1)(d): “ensure an adequate level of  cybersecurity protection for the  general-purpose AI model with systemic  risk and the physical infrastructure of  the model.”", "Point of Comparison": "Reporting mechanisms for  stakeholders", "#": "11", "Hiroshima Process Code of Conduct (Action 2)": "“Mechanisms to report  vulnerabilities, where  appropriate, should be  accessible to a diverse set of  stakeholders.”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:61", "label": "Action 3", "caption": "53(1)(a): “draw up and keep up-to-date the  technical documentation of the model,  including [...] providing it, upon request, to  the AI Office and the national competent  authorities;”   5 3(1)(b): “draw up, keep up-to-date and make  available information and documentation to  providers of AI systems who intend to  integrate the general-purpose AI model into  their AI systems.”   5 3(1)(d): “draw up and make publicly  available a sufficiently detailed summary about the content used for training of the  general-purpose AI model, according to a  template provided by the AI Office.”", "color": "#b3caa2", "size": 3.6864, "props": {"number": "1", "Comments": "The CoC requires public reporting.  The AIA requires three kinds of  reports:  1) one report upon request to the AI  Office and the national competent  authorities (53(1)(a))  2) one report to providers that  integrate the GPAI model. (53(1)(b))  3) one public report about the content  used for training (53(1)(d))   S imilar to action 4", "EU AI Act (GPAI focus)": "53(1)(a): “draw up and keep up-to-date the  technical documentation of the model,  including [...] providing it, upon request, to  the AI Office and the national competent  authorities;”   5 3(1)(b): “draw up, keep up-to-date and make  available information and documentation to  providers of AI systems who intend to  integrate the general-purpose AI model into  their AI systems.”   5 3(1)(d): “draw up and make publicly  available a sufficiently detailed summary about the content used for training of the  general-purpose AI model, according to a  template provided by the AI Office.”", "Point of Comparison": "Recipient of  technical  documentation and  information", "Hiroshima Process Code of Conduct (Action 3)": "“Publicly report”   “ This should include publishing  transparency reports”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:62", "label": "Action 3", "caption": "53(1)(a): “draw up and keep up-to-date the  technical documentation of the model” [report  to AIO]   5 3(1)(b): “draw up, keep up-to-date and  make available information and  documentation” [report to downstream  providers]", "color": "#b3caa2", "size": 3.6864, "props": {"number": "2", "Comments": "Keeping up-to-date is the same.   U pdating for all new significant  releases is reasonably implied by the  AIA, but publishing is not required.   S ubstantial modification is  considered for high-risk systems in  the AIA, but not explicitly for GPAI.", "EU AI Act (GPAI focus)": "53(1)(a): “draw up and keep up-to-date the  technical documentation of the model” [report  to AIO]   5 3(1)(b): “draw up, keep up-to-date and  make available information and  documentation” [report to downstream  providers]", "Point of Comparison": "Keep documentation  up-to-date", "Hiroshima Process Code of Conduct (Action 3)": "“should be kept up-to-date”   “ This should include publishing  transparency reports  containing meaningful  information for all new  significant releases of  advanced AI systems.”"}}, {"id": "4:bddcd563-cb09-427f-b255-f80858c4de80:63", "label": "Action 3", "caption": "53(1)(a): “draw up and keep up-to-date the technical documentation of the model, including its training and testing process and the results of its evaluation” [report to AIO] Annex XI(Section 2)(1): “A detailed description of the evaluation strategies, including evaluation results, on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies. Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification of limitations.”", "color": "#b3caa2", "size": 3.6864, "props": {"number": "3", "Comments": "AIA is more detailed and stringent than the CoC. While the CoC simply says “details of the evaluations”, the AIA
